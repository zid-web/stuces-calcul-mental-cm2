<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Maths Malin — CM2 &amp; 6ème</title>
<meta name="theme-color" content="#5B4FE8">
<meta name="description" content="Réviser en CM2 et 6ème : maths, histoire, géographie et dictée. Méthode de Singapour incluse.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --purple: #5B4FE8; --purple-dark: #3C3489;
    --bg: #F6F5FF; --card: #FFFFFF; --text: #232134; --text-secondary: #6B6880;
    --success: #1D9E75; --success-bg: #E1F5EE;
    --danger: #D85A30; --danger-bg: #FAECE7;
    --warning: #BA7517; --warning-bg: #FAEEDA;
    --border: #E4E2F1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #app { min-height: 100vh; min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + var(--install-offset, 0px)) env(safe-area-inset-left); display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; padding: 1.25rem 1rem 2rem; max-width: 480px; margin: 0 auto; width: 100%; }

  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.3rem; }
  .subtitle { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 1.1rem; }

  .level-switch { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 1.2rem; }
  .level-btn { flex: 1; padding: 0.6rem; border: none; border-radius: 9px; background: transparent; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary); }
  .level-btn.active { background: var(--purple); color: white; }

  .mode-card, .trick-card { display: flex; align-items: center; gap: 0.9rem; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.95rem 1rem; margin-bottom: 9px; cursor: pointer; }
  .mode-card:active, .trick-card:active { transform: scale(0.98); }
  .mode-emoji, .trick-emoji { font-size: 1.7rem; flex-shrink: 0; }
  .mode-info, .trick-info { flex: 1; min-width: 0; }
  .mode-title, .trick-title { font-weight: 600; font-size: 0.95rem; }
  .mode-desc { font-size: 0.78rem; color: var(--text-secondary); }
  .mode-arrow { font-size: 1.2rem; color: var(--purple); flex-shrink: 0; }
  .trick-progress { font-size: 0.72rem; color: var(--success); font-weight: 600; margin-top: 2px; }
  .trick-palier { font-size: 0.72rem; color: var(--text-secondary); font-weight: 600; margin-top: 2px; }
  .trick-palier .trick-progress { margin-top: 0; }
  .trick-card.outil { border-color: var(--purple); }
  .screen-liste .section-label { margin-top: 0.6rem; }
  .vitesse-aide { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.45; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 0.9rem; margin-bottom: 1rem; }
  .vitesse-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem 1rem; margin-bottom: 1rem; }
  .vitesse-card.monte { background: var(--success-bg); border-color: #A6DFCB; }
  .vitesse-titre { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.35rem; }
  .vitesse-texte { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.45; margin-top: 0.25rem; }
  .palier-ligne { display: flex; gap: 6px; margin: 0.3rem 0; }
  .palier-point { font-size: 1.15rem; opacity: 0.25; filter: grayscale(1); }
  .palier-point.atteint { opacity: 1; filter: none; }
  .saisie-zone { display: flex; flex-direction: column; gap: 10px; }
  .saisie-affichage { text-align: center; font-size: 1.8rem; font-weight: 800; letter-spacing: 1px; padding: 0.6rem; min-height: 3.2rem; background: var(--card); border: 2px solid var(--purple); border-radius: 14px; color: var(--text); }
  .saisie-affichage.ok { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .saisie-affichage.ko { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .saisie-vide { color: var(--border); }
  .pave { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pave-touche { padding: 0.8rem 0; font-size: 1.3rem; font-weight: 700; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; touch-action: manipulation; }
  .pave-touche:active { background: var(--bg); }
  .pave-touche:disabled, .btn:disabled { opacity: 0.45; cursor: default; }

  .btn { padding: 1rem; border-radius: 14px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--purple); color: white; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  /* un bouton indisponible doit se voir : sinon l'enfant appuie dans le vide */
  .btn:disabled, .btn-pause:disabled, .vitesse-btn:disabled { opacity: 0.4; cursor: default; }
  .btn-back { background: transparent; border: none; color: var(--purple); font-weight: 600; font-size: 0.92rem; padding: 0.5rem 0; margin-bottom: 0.3rem; align-self: flex-start; cursor: pointer; }
  .btn-stack { display: flex; flex-direction: column; gap: 10px; }

  .lesson-hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem 1.3rem; text-align: center; margin-bottom: 1.1rem; }
  .lesson-emoji { font-size: 2.2rem; margin-bottom: 0.5rem; }
  .lesson-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; }
  .lesson-explanation { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }

  .voix-alerte { background: var(--warning-bg); border: 1px solid #E8C98A; color: #8A5510; border-radius: 12px; padding: 0.8rem; font-size: 0.85rem; line-height: 1.4; margin-bottom: 1rem; }
  .dictee-lecteur { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 1.1rem; }
  .dictee-phrase-info { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-align: center; margin-bottom: 0.7rem; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .dictee-vitesse { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 0.8rem; font-size: 0.8rem; color: var(--text-secondary); }
  .vitesse-btn { border: 1px solid var(--border); background: transparent; color: var(--text-secondary); border-radius: 8px; padding: 0.28rem 0.6rem; font-weight: 700; font-size: 0.78rem; cursor: pointer; }
  .vitesse-btn.active { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
  .dictee-saisie { width: 100%; border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem; font-size: 1rem; line-height: 1.5; font-family: inherit; color: var(--text); background: var(--card); resize: vertical; }
  .dictee-saisie:focus { outline: 2px solid var(--purple); outline-offset: -1px; }

  .zone-parent { border: 1px dashed var(--purple); border-radius: 14px; padding: 0.9rem; margin-bottom: 1.1rem; background: var(--card); }
  .zone-parent-titre { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--purple); margin-bottom: 0.6rem; }
  .phrase-lire { display: flex; gap: 8px; padding: 0.45rem 0; font-size: 0.95rem; line-height: 1.5; border-bottom: 1px solid var(--border); }
  .phrase-lire:last-child { border-bottom: none; }
  .phrase-lire.courante { background: var(--bg); border-radius: 8px; padding-left: 0.5rem; padding-right: 0.5rem; }
  .phrase-num { font-weight: 700; color: var(--purple); flex-shrink: 0; }
  .btn-parent { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; font-size: 0.8rem; border-radius: 10px; padding: 0.5rem 0.8rem; cursor: pointer; width: 100%; }
  .copie { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; line-height: 2; font-size: 0.98rem; margin-bottom: 0.7rem; }
  .mot { padding: 1px 3px; border-radius: 5px; }
  .mot.ok { color: var(--text); }
  .mot.faute { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
  .mot.oubli { background: var(--warning-bg); color: #8A5510; font-weight: 700; text-decoration: underline dotted; }
  .mot.ajout { background: #EFEDF5; color: var(--text-secondary); }
  .mot s { opacity: 0.75; font-weight: 400; }
  .legende { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.76rem; color: var(--text-secondary); margin-bottom: 1rem; }
  .legende span { display: flex; align-items: center; gap: 4px; }
  .pastille { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .pastille.ok { background: var(--text); }
  .pastille.faute { background: var(--danger); }
  .pastille.oubli { background: #BA7517; }
  .pastille.ajout { background: #C9C5D6; }
  .cours-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 10px; font-size: 0.92rem; line-height: 1.55; }
  .cours-card p { margin-bottom: 0.7rem; }
  .cours-card p:last-child { margin-bottom: 0; }
  .cours-card strong { color: var(--purple); }
  .reperes { background: var(--bg); border-radius: 10px; padding: 0.7rem 0.8rem; margin-top: 0.7rem; }
  .repere { display: flex; gap: 8px; font-size: 0.86rem; padding: 0.2rem 0; }
  .repere-cle { font-weight: 700; color: var(--purple); white-space: nowrap; }
  .section-label { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 0.6rem; }

  .step-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem; margin-bottom: 10px; text-align: center; }
  .step-formula { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.3rem; }
  .step-breakdown { font-size: 0.83rem; color: var(--text-secondary); background: var(--bg); padding: 0.5rem 0.7rem; border-radius: 8px; margin: 0.4rem 0; }
  .step-result { font-size: 1.05rem; font-weight: 700; color: var(--purple); }
  .step-shape { display: flex; justify-content: center; margin: 0.5rem 0; }

  .correction { background: var(--danger-bg); border: 1px solid #F0BCA6; border-radius: 16px; padding: 1rem; margin-bottom: 1rem; }
  .correction-titre { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--danger); margin-bottom: 0.6rem; }
  .correction-ligne { font-size: 0.92rem; line-height: 1.5; margin-bottom: 0.35rem; }
  .correction-ligne s { color: var(--text-secondary); }
  .correction-bonne { font-weight: 700; color: var(--success); }
  .correction-expl { background: var(--card); border-radius: 10px; padding: 0.7rem 0.8rem; font-size: 0.88rem; line-height: 1.5; margin-top: 0.6rem; }
  .correction-expl-titre { font-weight: 700; color: var(--purple); margin-bottom: 2px; }

  .revoir { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem; margin-bottom: 10px; }
  .revoir-num { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .revoir-question { font-weight: 600; font-size: 0.92rem; margin: 0.3rem 0 0.5rem; line-height: 1.4; }
  .revoir-reponses { font-size: 0.88rem; line-height: 1.6; }
  .revoir-expl { background: var(--bg); border-radius: 9px; padding: 0.6rem 0.7rem; font-size: 0.85rem; line-height: 1.5; margin-top: 0.5rem; }
  .quiz-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .btn-pause { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); font-weight: 700; font-size: 0.76rem; border-radius: 9px; padding: 0.32rem 0.6rem; cursor: pointer; }

  .pause-panel { background: var(--card); border: 1px dashed var(--purple); border-radius: 16px; padding: 2.2rem 1.1rem; text-align: center; margin-bottom: 1.1rem; }
  .pause-emoji { font-size: 2.2rem; margin-bottom: 0.5rem; }
  .pause-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.3rem; }
  .pause-note { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; }

  .seance { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 1rem; }
  .seance-finie { border-color: #A6DFCB; background: var(--success-bg); }
  .seance-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 0.7rem; }
  .seance-titre { font-weight: 700; font-size: 1rem; }
  .seance-sous { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
  .serie { font-size: 1rem; font-weight: 700; color: var(--danger); white-space: nowrap; }
  .seance-barre { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 0.8rem; }
  .seance-barre-jauge { height: 100%; background: var(--purple); border-radius: 3px; transition: width 0.3s; }
  .etape { display: flex; align-items: center; gap: 10px; padding: 0.6rem 0; border-top: 1px solid var(--border); cursor: pointer; }
  .etape:active { opacity: 0.7; }
  .etape-coche { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
  .etape.faite .etape-coche { background: var(--success); border-color: var(--success); color: #FFFFFF; }
  .etape.faite .etape-titre { text-decoration: line-through; color: var(--text-secondary); }
  .etape-info { flex: 1; min-width: 0; }
  .etape.verrou { cursor: default; opacity: 0.55; }
  .etape.verrou:active { opacity: 0.55; }
  .etape.verrou .etape-coche { font-size: 0.7rem; }
  .etape-titre { font-weight: 600; font-size: 0.92rem; }
  .etape-detail { font-size: 0.76rem; color: var(--text-secondary); }
  .reward-strip { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.8rem 0.9rem; margin-bottom: 1rem; }
  .reward-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.5rem; gap: 8px; }
  .reward-label { font-size: 0.82rem; font-weight: 700; }
  .reward-count { font-size: 0.78rem; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
  .token-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .token { font-size: 1.15rem; line-height: 1; }
  .token.vide { opacity: 0.22; filter: grayscale(1); }
  .reward-hamsters { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); font-size: 0.84rem; font-weight: 600; color: var(--purple); }

  .gain-card { background: var(--success-bg); border: 1px solid #A6DFCB; border-radius: 16px; padding: 1rem; text-align: center; margin-bottom: 1rem; }
  .gain-emoji { font-size: 1.9rem; line-height: 1.2; }
  .gain-text { font-size: 0.88rem; font-weight: 700; color: #14795A; }
  .gain-sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
  .hamster-card { background: linear-gradient(135deg, #5B4FE8, #3B82D8); color: #FFFFFF; border-radius: 18px; padding: 1.5rem 1.1rem; text-align: center; margin-bottom: 1rem; }
  .hamster-emoji { font-size: 3rem; line-height: 1.1; }
  .hamster-title { font-size: 1.1rem; font-weight: 700; margin-top: 0.4rem; }
  .hamster-note { font-size: 0.85rem; opacity: 0.9; margin-top: 0.3rem; line-height: 1.4; }
  .quiz-progress { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
  .quiz-score { font-size: 1.1rem; font-weight: 700; }

  .timer-wrap { margin-bottom: 1.1rem; }
  .timer-bar-bg { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
  .timer-bar-fill { height: 100%; background: var(--purple); border-radius: 4px; transition: width 0.9s linear, background-color 0.3s; }
  .timer-bar-fill.low { background: var(--danger); }
  .timer-num { font-size: 0.76rem; color: var(--text-secondary); text-align: right; }

  .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem 1.1rem; text-align: center; margin-bottom: 1.1rem; }
  .question-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.7rem; }
  .question-formula { font-size: 1.9rem; font-weight: 700; }
  .question-shape { display: flex; justify-content: center; margin: 0.7rem 0; }
  .question-shape svg { max-width: 100%; height: auto; }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .option-btn { padding: 0.95rem; font-size: 1rem; font-weight: 700; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .option-btn.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .option-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

  .results-emoji { font-size: 3.2rem; text-align: center; margin: 0.8rem 0; }
  .results-title { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 1.1rem; }
  .results-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
  .results-score { font-size: 2.1rem; font-weight: 700; color: var(--purple); margin: 0.3rem 0; }
  .results-meta { font-size: 0.83rem; color: var(--text-secondary); }
  .verdict-box { padding: 1rem; border-radius: 14px; margin-bottom: 1rem; font-size: 0.88rem; line-height: 1.4; }
  .verdict-good { background: var(--success-bg); color: var(--success); }
  .verdict-mid { background: var(--warning-bg); color: var(--warning); }
  .verdict-low { background: var(--danger-bg); color: var(--danger); }
  .breakdown-list { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem 1rem; margin-bottom: 1.1rem; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.86rem; border-bottom: 1px solid var(--border); }
  .breakdown-row:last-child { border-bottom: none; }

  .install-banner { position: fixed; bottom: 0; left: 0; right: 0; background: var(--purple); color: white; padding: 1rem 1.2rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 1rem; z-index: 100; }
  .install-banner button { padding: 0.6rem 1rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
  .install-banner .install-btn { background: white; color: var(--purple); }
  .install-banner .dismiss-btn { background: transparent; color: white; opacity: 0.8; }
  .install-text { flex: 1; font-size: 0.9rem; }
  .install-help { display: block; font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

  /* ================= Figures ================= */
  .fig { width: 190px; max-width: 100%; height: auto; }
  .fig-large { width: 280px; }

  /* ================= Téléphone en paysage =================
     Peu de hauteur disponible : on resserre le vertical pour que la question
     et ses réponses tiennent ensemble à l'écran. */
  @media (orientation: landscape) and (max-height: 520px) {
    .screen { padding-top: 0.7rem; padding-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.15rem; }
    .subtitle { font-size: 0.8rem; margin-bottom: 0.7rem; }
    .lesson-hero { padding: 0.9rem 1rem; margin-bottom: 0.7rem; }
    .lesson-emoji { font-size: 1.6rem; margin-bottom: 0.25rem; }
    .question-card { padding: 0.9rem; margin-bottom: 0.7rem; }
    .question-formula { font-size: 1.5rem; }
    .timer-wrap { margin-bottom: 0.7rem; }
    .fig { width: 130px; }
    .fig-large { width: 210px; }
    .results-emoji { font-size: 2.2rem; }
  }

  /* ================= Tablette =================
     À partir d'ici l'écran est assez large pour deux colonnes de cartes :
     une seule colonne étirée sur une tablette laisse des marges énormes. */
  @media (min-width: 700px) {
    body { font-size: 15px; }
    .screen { max-width: 780px; padding: 1.75rem 1.5rem 2.5rem; }
    h1 { font-size: 1.9rem; }
    .subtitle { font-size: 1rem; margin-bottom: 1.4rem; }
    .level-btn { padding: 0.75rem; font-size: 1rem; }

    .cartes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; }
    .cartes > .mode-card, .cartes > .trick-card { margin-bottom: 0; }
    .exemples { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-items: start; }
    .exemples > .step-card { margin-bottom: 0; }

    .mode-title, .trick-title { font-size: 1.02rem; }
    .lesson-title { font-size: 1.35rem; }
    .lesson-explanation { font-size: 1rem; }
    .cours-card { font-size: 1rem; max-width: 68ch; }
    .question-formula { font-size: 2.3rem; }
    .option-btn { padding: 1.15rem; font-size: 1.1rem; }
    .fig { width: 240px; }

<body>
<div id="app"></div>
<script>
/* ================= Utils ================= */
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function rndMultiple(minMult, maxMult, step) { return rnd(minMult, maxMult) * step; }
function shuffle(arr) { return arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]); }
function formatNum(n) {
  const r = Math.round(n * 100) / 100;
  const s = (r % 1 === 0) ? String(r) : String(r);
  return s.replace('.', ',');
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function isPrime(n) { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function numericOptions(answer, decimals) {
  const opts = new Set([answer]);
  let guard = 0;
  while (opts.size < 4 && guard < 40) {
    guard++;
    const delta = decimals > 0 ? (Math.random() < 0.5 ? -1 : 1) * (Math.round((Math.random() * 3 + 0.5) * 10) / 10) : (Math.random() < 0.5 ? -1 : 1) * rnd(1, 8);
    let v = decimals > 0 ? Math.round((answer + delta) * 10) / 10 : Math.round(answer + delta);
    if (!isNaN(v)) opts.add(v);
  }
  return shuffle([...opts]);
}
/* Des propositions de secours construites à partir de la réponse : un chiffre
   voisin, un numérateur ou un dénominateur décalé. Sert quand les distracteurs
   fournis se doublonnent ou tombent sur la bonne réponse. */
function variantes(correct) {
  const frac = /^(\d+)\/(\d+)$/.exec(correct);
  if (frac) {
    const a = +frac[1], b = +frac[2], out = [];
    for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1], [-1, 1], [2, 0], [0, 2]]) {
      const na = a + da, nb = b + db;
      if (na > 0 && nb > 1 && na < nb) out.push(`${na}/${nb}`);
    }
    return out;
  }
  const n = parseFloat(String(correct).replace(',', '.'));
  if (!isNaN(n) && String(correct).match(/^-?\d/)) {
    const dec = String(correct).includes(',') ? 1 : 0;
    return [1, -1, 2, -2, 3, -3].map(d => n + d).filter(v => v > 0)
      .map(v => formatNum(dec ? Math.round(v * 10) / 10 : v));
  }
  return [];
}

function mkOptions(correct, distractors) {
  const uniq = [];
  const ajouter = (d) => { if (d !== correct && !uniq.includes(d) && uniq.length < 3) uniq.push(d); };
  distractors.forEach(ajouter);
  /* plutôt que de compléter avec du remplissage absurde (« 2/5_2 »), on
     fabrique des variantes ; et s'il en manque encore, on propose moins de choix */
  variantes(correct).forEach(ajouter);
  return shuffle([correct, ...uniq]);
}
function loadStore() { try { return JSON.parse(localStorage.getItem('cm_store') || '{}'); } catch { return {}; } }
function saveStore(obj) { localStorage.setItem('cm_store', JSON.stringify(obj)); }
function saveBest(key, pct) { const s = loadStore(); s[key] = Math.max(s[key] || 0, pct); saveStore(s); }
function getBest(key) { return loadStore()[key]; }

/* ---------- Jetons chatons et récompenses hamster ---------- */
const SEUIL_JETON = 80;          // un quiz est réussi à partir de 80 % de bonnes réponses
const JETONS_PAR_HAMSTER = 10;   // dix chatons donnent un hamster

function getJetons() { return loadStore().jetons || 0; }
function getHamsters() { return loadStore().hamsters || 0; }

/* Appelée une seule fois, à la fin d'un quiz. Renvoie ce qui vient d'être
   gagné pour que l'écran de résultat puisse l'annoncer. */
function attribuerRecompense(pct) {
  if (pct < SEUIL_JETON) return { jeton: false, hamster: false, jetons: getJetons(), hamsters: getHamsters() };
  const s = loadStore();
  let jetons = (s.jetons || 0) + 1, hamsters = s.hamsters || 0, hamster = false;
  if (jetons >= JETONS_PAR_HAMSTER) { jetons -= JETONS_PAR_HAMSTER; hamsters++; hamster = true; }
  s.jetons = jetons; s.hamsters = hamsters; saveStore(s);
  return { jeton: true, hamster, jetons, hamsters };
}

/* ================= SVG helpers ================= */
function svgWrap(inner) { return `<svg class="fig" viewBox="0 0 220 180">${inner}</svg>`; }
function svgSquare(a) {
  return svgWrap(`<rect x="50" y="30" width="120" height="120" fill="none" stroke="#5B4FE8" stroke-width="4"/><text x="110" y="20" text-anchor="middle" font-size="15" fill="#232134">${formatNum(a)} cm</text>`);
}
function svgRectangle(L, l) {
  const w = Math.min(170, Math.max(70, L * 9)), h = Math.min(120, Math.max(40, l * 9));
  const x = (220 - w) / 2, y = (170 - h) / 2;
  return svgWrap(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#5B4FE8" stroke-width="4"/><text x="110" y="${y - 8}" text-anchor="middle" font-size="14" fill="#232134">${formatNum(L)} cm</text><text x="${x + w + 30}" y="${y + h / 2}" text-anchor="middle" font-size="14" fill="#232134">${formatNum(l)} cm</text>`);
}
function svgTriangleRight(base, hauteur) {
  const bw = Math.min(150, Math.max(70, base * 8)), bh = Math.min(120, Math.max(50, hauteur * 8));
  const x0 = (220 - bw) / 2, y0 = 150;
  return svgWrap(`<polygon points="${x0},${y0} ${x0 + bw},${y0} ${x0},${y0 - bh}" fill="none" stroke="#0F6E56" stroke-width="4"/><text x="${x0 + bw / 2}" y="${y0 + 18}" text-anchor="middle" font-size="14" fill="#232134">${formatNum(base)} cm</text><text x="${x0 - 12}" y="${y0 - bh / 2}" text-anchor="end" font-size="14" fill="#232134">${formatNum(hauteur)} cm</text>`);
}
function svgTrianglePerim(a, b, c) {
  return svgWrap(`<polygon points="40,150 180,150 100,30" fill="none" stroke="#0F6E56" stroke-width="4"/><text x="110" y="168" text-anchor="middle" font-size="13" fill="#232134">${formatNum(a)} cm</text><text x="150" y="90" text-anchor="middle" font-size="13" fill="#232134">${formatNum(b)} cm</text><text x="65" y="90" text-anchor="middle" font-size="13" fill="#232134">${formatNum(c)} cm</text>`);
}
function svgCircle(r) {
  const px = Math.min(70, Math.max(35, r * 6));
  return svgWrap(`<circle cx="110" cy="95" r="${px}" fill="none" stroke="#993C1D" stroke-width="4"/><line x1="110" y1="95" x2="${110 + px}" y2="95" stroke="#993C1D" stroke-width="2"/><text x="${110 + px / 2}" y="88" text-anchor="middle" font-size="13" fill="#232134">${formatNum(r)} cm</text>`);
}
function svgAngle(deg) {
  const vx = 60, vy = 150, ray = 110, rad = deg * Math.PI / 180;
  const x2 = vx + ray * Math.cos(rad), y2 = vy - ray * Math.sin(rad);
  return svgWrap(`<line x1="${vx}" y1="${vy}" x2="${vx + ray}" y2="${vy}" stroke="#534AB7" stroke-width="4"/><line x1="${vx}" y1="${vy}" x2="${x2}" y2="${y2}" stroke="#534AB7" stroke-width="4"/><path d="M ${vx + 26} ${vy} A 26 26 0 0 0 ${vx + 26 * Math.cos(rad)} ${vy - 26 * Math.sin(rad)}" fill="none" stroke="#D85A30" stroke-width="2"/>`);
}
function svgPolygon(n) {
  const cx = 110, cy = 95, R = 65; let pts = [];
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push(`${cx + R * Math.cos(a)},${cy + R * Math.sin(a)}`); }
  return svgWrap(`<polygon points="${pts.join(' ')}" fill="none" stroke="#185FA5" stroke-width="4"/>`);
}
function svgCircleShape() { return svgWrap(`<circle cx="110" cy="95" r="60" fill="none" stroke="#185FA5" stroke-width="4"/>`); }
function svgFractionBar(n, m) {
  const w = 180 / n;
  let rects = '';
  for (let i = 0; i < n; i++) { rects += `<rect x="${20 + i * w}" y="70" width="${w - 3}" height="50" fill="${i < m ? '#5B4FE8' : '#FFFFFF'}" stroke="#5B4FE8" stroke-width="2"/>`; }
  return svgWrap(rects);
}
function svgGridPoint(x, y, size) {
  const unit = 25, ox = 30, oy = 150;
  let lines = '';
  for (let i = 0; i <= size; i++) {
    lines += `<line x1="${ox + i * unit}" y1="${oy}" x2="${ox + i * unit}" y2="${oy - size * unit}" stroke="#E4E2F1" stroke-width="1"/>`;
    lines += `<line x1="${ox}" y1="${oy - i * unit}" x2="${ox + size * unit}" y2="${oy - i * unit}" stroke="#E4E2F1" stroke-width="1"/>`;
    lines += `<text x="${ox + i * unit}" y="${oy + 14}" font-size="10" text-anchor="middle" fill="#6B6880">${i}</text>`;
    lines += `<text x="${ox - 10}" y="${oy - i * unit + 3}" font-size="10" text-anchor="middle" fill="#6B6880">${i}</text>`;
  }
  lines += `<line x1="${ox}" y1="${oy}" x2="${ox + size * unit}" y2="${oy}" stroke="#232134" stroke-width="2"/>`;
  lines += `<line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy - size * unit}" stroke="#232134" stroke-width="2"/>`;
  lines += `<circle cx="${ox + x * unit}" cy="${oy - y * unit}" r="6" fill="#D85A30"/>`;
  return svgWrap(lines);
}
function svgTwoLines(kind) {
  if (kind === 'Parallèles') return svgWrap(`<line x1="30" y1="70" x2="190" y2="70" stroke="#534AB7" stroke-width="4"/><line x1="30" y1="120" x2="190" y2="120" stroke="#534AB7" stroke-width="4"/>`);
  if (kind === 'Perpendiculaires') return svgWrap(`<line x1="30" y1="95" x2="190" y2="95" stroke="#534AB7" stroke-width="4"/><line x1="110" y1="20" x2="110" y2="170" stroke="#534AB7" stroke-width="4"/>`);
  const deg = rnd(20, 70) * (Math.random() < 0.5 ? 1 : -1);
  const rad = deg * Math.PI / 180;
  const dx = 90 * Math.cos(rad), dy = 90 * Math.sin(rad);
  return svgWrap(`<line x1="30" y1="95" x2="190" y2="95" stroke="#534AB7" stroke-width="4"/><line x1="${110 - dx}" y1="${95 - dy}" x2="${110 + dx}" y2="${95 + dy}" stroke="#534AB7" stroke-width="4"/>`);
}
const SYMMETRY_SHAPES = [
  { svg: svgWrap(`<rect x="60" y="30" width="100" height="100" fill="none" stroke="#5B4FE8" stroke-width="4"/><line x1="110" y1="20" x2="110" y2="140" stroke="#D85A30" stroke-width="2" stroke-dasharray="6,4"/>`), symmetric: true },
  { svg: svgWrap(`<circle cx="110" cy="85" r="60" fill="none" stroke="#5B4FE8" stroke-width="4"/><line x1="110" y1="15" x2="110" y2="155" stroke="#D85A30" stroke-width="2" stroke-dasharray="6,4"/>`), symmetric: true },
  { svg: svgWrap(`<polygon points="110,30 160,140 60,140" fill="none" stroke="#5B4FE8" stroke-width="4"/><line x1="110" y1="15" x2="110" y2="150" stroke="#D85A30" stroke-width="2" stroke-dasharray="6,4"/>`), symmetric: true },
  { svg: svgWrap(`<polygon points="60,140 180,140 180,60" fill="none" stroke="#5B4FE8" stroke-width="4"/><line x1="120" y1="15" x2="120" y2="150" stroke="#D85A30" stroke-width="2" stroke-dasharray="6,4"/>`), symmetric: false },
  { svg: svgWrap(`<polygon points="50,140 140,140 140,90 100,90 100,60 170,60 170,30 50,30" fill="none" stroke="#5B4FE8" stroke-width="4"/><line x1="110" y1="15" x2="110" y2="150" stroke="#D85A30" stroke-width="2" stroke-dasharray="6,4"/>`), symmetric: false },
  { svg: svgWrap(`<polygon points="30,90 130,40 190,90 130,140" fill="none" stroke="#5B4FE8" stroke-width="4"/><line x1="110" y1="15" x2="110" y2="150" stroke="#D85A30" stroke-width="2" stroke-dasharray="6,4"/>`), symmetric: false }
];

/* ---------- Dessins de la méthode de Singapour ---------- */
function svgWide(inner, h) { return `<svg class="fig fig-large" viewBox="0 0 300 ${h}">${inner}</svg>`; }

/* Le modèle en barres : une barre par personne, découpée en parts égales.
   `extra` ajoute un bloc distinct pour un écart (« 12 de plus »). */
function svgBarModel(rows, total) {
  const maxU = Math.max(...rows.map(r => r.units + (r.extra ? 1 : 0)));
  const x0 = 56, W = 172, u = W / maxU, bh = 24, gap = 12;
  let out = '', y = 12;
  rows.forEach(r => {
    out += `<text x="${x0 - 8}" y="${y + 17}" text-anchor="end" font-size="12" fill="#6B6880">${r.name}</text>`;
    for (let i = 0; i < r.units; i++) out += `<rect x="${x0 + i * u}" y="${y}" width="${u}" height="${bh}" fill="#EDEBFF" stroke="#5B4FE8" stroke-width="2"/>`;
    if (r.extra) out += `<rect x="${x0 + r.units * u}" y="${y}" width="${u}" height="${bh}" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/><text x="${x0 + (r.units + 0.5) * u}" y="${y + 17}" text-anchor="middle" font-size="11" font-weight="700" fill="#8A5510">${r.extra}</text>`;
    if (r.label) out += `<text x="${x0 + (r.units + (r.extra ? 1 : 0)) * u + 7}" y="${y + 17}" font-size="12" font-weight="700" fill="#5B4FE8">${r.label}</text>`;
    y += bh + gap;
  });
  if (total) {
    const tw = x0 + maxU * u;
    out += `<path d="M ${x0} ${y} L ${x0} ${y + 7} L ${tw} ${y + 7} L ${tw} ${y}" fill="none" stroke="#6B6880" stroke-width="2"/><text x="${(x0 + tw) / 2}" y="${y + 23}" text-anchor="middle" font-size="12" font-weight="700" fill="#232134">${total}</text>`;
    y += 28;
  }
  return svgWide(out, y + 4);
}

/* Cercle avec son rayon ou son diamètre tracé et légendé. */
function svgCircleLabeled(value, kind) {
  const R = 62, cx = 150, cy = 78;
  const trait = kind === 'diamètre'
    ? `<line x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="#D85A30" stroke-width="3"/>`
    : `<line x1="${cx}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="#D85A30" stroke-width="3"/>`;
  const tx = kind === 'diamètre' ? cx : cx + R / 2;
  return svgWide(`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#5B4FE8" stroke-width="4"/>${trait}<circle cx="${cx}" cy="${cy}" r="3" fill="#5B4FE8"/><text x="${tx}" y="${cy - 8}" text-anchor="middle" font-size="13" font-weight="700" fill="#232134">${value} cm</text>`, 156);
}

/* Pavé droit en perspective, chaque dimension légendée. */
function svgCuboid(L, l, h) {
  const x = 62, y = 44, w = 130, ht = 62, d = 30;
  return svgWide(`<polygon points="${x},${y + d} ${x + w},${y + d} ${x + w},${y + d + ht} ${x},${y + d + ht}" fill="#EDEBFF" stroke="#5B4FE8" stroke-width="3"/>
    <polygon points="${x},${y + d} ${x + d},${y} ${x + w + d},${y} ${x + w},${y + d}" fill="#DEDAFF" stroke="#5B4FE8" stroke-width="3"/>
    <polygon points="${x + w},${y + d} ${x + w + d},${y} ${x + w + d},${y + ht} ${x + w},${y + d + ht}" fill="#CFC9FF" stroke="#5B4FE8" stroke-width="3"/>
    <text x="${x + w / 2}" y="${y + d + ht + 18}" text-anchor="middle" font-size="12" fill="#232134">${L} cm</text>
    <text x="${x - 6}" y="${y + d + ht / 2 + 4}" text-anchor="end" font-size="12" fill="#232134">${h} cm</text>
    <text x="${x + w + d + 6}" y="${y + 14}" font-size="12" fill="#232134">${l} cm</text>`, 166);
}

/* Diagramme circulaire : parts = [{ label, frac }], fractions cumulant 1. */
function svgPie(parts) {
  const cx = 118, cy = 78, R = 62, teintes = ['#5B4FE8', '#1D9E75', '#D85A30', '#BA7517', '#8E86F0'];
  let a0 = -Math.PI / 2, out = '', ly = 26;
  parts.forEach((p, i) => {
    const a1 = a0 + p.frac * 2 * Math.PI, large = p.frac > 0.5 ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    out += `<path d="M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} Z" fill="${teintes[i % teintes.length]}" stroke="#FFFFFF" stroke-width="2"/>`;
    out += `<rect x="196" y="${ly - 9}" width="11" height="11" fill="${teintes[i % teintes.length]}"/><text x="213" y="${ly}" font-size="11" fill="#232134">${p.label}</text>`;
    a0 = a1; ly += 19;
  });
  return svgWide(out, Math.max(156, ly + 6));
}

/* Des distracteurs proportionnels à la réponse : sur de grands nombres, un
   écart d'une ou deux unités rendrait le bon choix trop évident. */
function spreadOptions(answer, decimals) {
  const arrondi = (v) => decimals > 0 ? Math.round(v * 10) / 10 : Math.round(v);
  const pas = Math.max(decimals > 0 ? 0.5 : 1, arrondi(Math.abs(answer) * 0.12));
  const cible = arrondi(answer), opts = new Set([cible]);
  for (const d of shuffle([pas, -pas, 2 * pas, -2 * pas, 3 * pas])) {
    if (opts.size >= 4) break;
    const v = arrondi(answer + d);
    if (v > 0 && v !== cible) opts.add(v);
  }
  let k = 3; while (opts.size < 4) { opts.add(arrondi(answer + pas * ++k)); }
  return shuffle([...opts]).map(formatNum);
}

const SG_NOMS = ['Aya', 'Ben', 'Chloé', 'Diego', 'Emma', 'Farid', 'Gaby', 'Hugo', 'Inès', 'Jonas'];
const SG_OBJETS = ['billes', 'autocollants', 'cartes', 'timbres', 'perles'];
function sgDeuxNoms() { const s = shuffle(SG_NOMS); return [s[0], s[1]]; }
function sgObjet() { return SG_OBJETS[rnd(0, SG_OBJETS.length - 1)]; }

/* ================= Astuces de calcul mental (domaine spécial) ================= */
/* Chaque générateur renvoie le calcul, sa décomposition (l'astuce appliquée)
   et, quand c'est possible, des « pièges » : les résultats qu'on obtient en
   faisant l'erreur typique. Ils servent de mauvaises réponses au QCM, bien
   plus instructives que des nombres tirés au hasard. */

/* nombre de départ à 2, 3 ou 4 chiffres, au moins égal à minA */
function nombreDepart(minA) {
  const tranches = [[10, 99], [100, 999], [1000, 9999]].filter(([, hi]) => hi >= minA);
  const [lo, hi] = tranches[rnd(0, tranches.length - 1)];
  return rnd(Math.max(lo, minA), hi);
}

/* + ou − un nombre qui finit par 8 ou 9 (8, 38, 49, 199, 298…) :
   on passe par le nombre rond juste au-dessus, puis on corrige l'écart. */
function genPresqueRond(chiffre, op) {
  const ecart = 10 - chiffre, t = Math.random();
  let n;
  if (t < 0.2) n = chiffre;                                   /* 8 ou 9 */
  else if (t < 0.6) n = rnd(1, 9) * 10 + chiffre;             /* 18 … 99 */
  else if (t < 0.8) n = rnd(1, 9) * 100 + 90 + chiffre;       /* 198, 299… */
  else n = rnd(10, 99) * 10 + chiffre;                        /* 138, 459… */
  const rond = n + ecart;
  const a = nombreDepart(op === '-' ? rond + 10 : 10);
  const step = op === '+' ? a + rond : a - rond;
  const result = op === '+' ? a + n : a - n;
  const breakdown = op === '+'
    ? `${n} = ${rond} − ${ecart} : ${formatNum(a)} + ${rond} = ${formatNum(step)}, puis − ${ecart}`
    : `${n} = ${rond} − ${ecart} : ${formatNum(a)} − ${rond} = ${formatNum(step)}, puis + ${ecart}`;
  /* oublier la correction, ou la faire dans le mauvais sens */
  const pieges = op === '+' ? [step, step + ecart] : [step, step - ecart];
  return { formula: `${formatNum(a)} ${op === '+' ? '+' : '−'} ${n}`, breakdown, result, pieges };
}

/* + ou − un nombre qui dépasse juste un nombre rond (11, 21, 102, 301…) */
function genJusteApres(op) {
  const ecart = rnd(1, 2), t = Math.random();
  const rond = t < 0.5 ? rnd(1, 9) * 10 : t < 0.8 ? rnd(1, 9) * 100 : rnd(11, 99) * 10;
  const n = rond + ecart;
  const a = nombreDepart(op === '-' ? n + 10 : 10);
  const step = op === '+' ? a + rond : a - rond;
  const result = op === '+' ? a + n : a - n;
  const breakdown = op === '+'
    ? `${n} = ${rond} + ${ecart} : ${formatNum(a)} + ${rond} = ${formatNum(step)}, puis + ${ecart}`
    : `${n} = ${rond} + ${ecart} : ${formatNum(a)} − ${rond} = ${formatNum(step)}, puis − ${ecart}`;
  const pieges = op === '+' ? [step, step - ecart] : [step, step + ecart];
  return { formula: `${formatNum(a)} ${op === '+' ? '+' : '−'} ${n}`, breakdown, result, pieges };
}

/* le complément « chiffre par chiffre à 10 », erreur classique : 100 − 37 → 73 */
function complementFaux(b, cible) {
  const ch = String(b).padStart(String(cible).length - 1, '0').split('').map(Number);
  return Number(ch.map(c => 10 - c).join('').slice(-ch.length));
}

  { id: 'vitesse', emoji: '🚗', title: 'Vitesse', skills: [

        const noms = shuffle(['Rouge', 'Bleu', 'Vert', 'Jaune', 'Violet']).slice(0, 3);
        const i = rnd(0, 2), rep = reparts[i];
        return q({ category: 'Pourcentage manquant', prompt: `Quel pourcentage manque pour le secteur « ${noms[i]} » ?`,
          svg: svgPie(reparts.map((p, k) => ({ label: `${noms[k]} ${k === i ? '?' : p + ' %'}`, frac: p / 100 }))),
          answer: formatNum(rep), unit: '%', options: spreadOptions(rep, 0), limit: 30 });
      } },
    { id: 'pie-angle', title: "D'un angle à un effectif", explanation: "Le disque entier fait 360°. Un secteur de 90° vaut donc 90/360, soit le quart du total.", levels: ['singapour'],
      question() {
        /* 72 divise 360 pour chacun de ces angles : la réponse tombe juste */
        const angle = [30, 45, 60, 90, 120, 180][rnd(0, 5)], total = rnd(1, 8) * 72;
        const rep = angle / 360 * total;
        return q({ category: 'Angle du secteur', prompt: `Dans un diagramme circulaire, un secteur mesure ${angle}°. Le total est ${total} personnes. Combien de personnes ce secteur représente-t-il ?`,
          svg: svgPie([{ label: `${angle}°`, frac: angle / 360 }, { label: 'reste', frac: 1 - angle / 360 }]),
          answer: formatNum(rep), options: spreadOptions(rep, 0), limit: 35 });
      } }
  ] },

        "Dans la <strong>Grèce antique</strong>, les habitants sont regroupés en <strong>cités</strong> indépendantes comme <strong>Athènes</strong> et <strong>Sparte</strong>. À Athènes naît la <strong>démocratie</strong> : les citoyens votent eux-mêmes les lois. Attention : femmes, esclaves et étrangers en sont exclus.",
        "Les Grecs sont <strong>polythéistes</strong> : ils croient en plusieurs dieux, comme <strong>Zeus</strong>, <strong>Athéna</strong> ou <strong>Poséidon</strong>. Leurs récits fondateurs sont racontés dans deux grands poèmes attribués à <strong>Homère</strong> : <strong>l'Iliade</strong> et <strong>l'Odyssée</strong>.",

      question() { return questionDeBanque([
        { cat: 'Antiquité', prompt: "Dans quelle cité grecque naît la démocratie ?", answer: 'Athènes', faux: ['Sparte', 'Rome', 'Olympie'], expl: "À Athènes, où les citoyens votaient eux-mêmes les lois sur l'Agora." },
        { cat: 'Antiquité', prompt: "Que veut dire « polythéiste » ?", answer: 'Croire en plusieurs dieux', faux: ['Croire en un seul dieu', 'Ne croire en aucun dieu', 'Croire aux ancêtres'], expl: "Poly veut dire plusieurs et théos veut dire dieu : croire en plusieurs dieux." },
        { cat: 'Antiquité', prompt: "Quel poète grec a composé l'Iliade et l'Odyssée ?", answer: 'Homère', faux: ['Platon', 'Socrate', 'Hérodote'], expl: "Homère, à qui l'on attribue ces deux grands récits fondateurs." },
        { cat: 'Antiquité', prompt: "Qui est le roi des dieux chez les Grecs ?", answer: 'Zeus', faux: ['Jupiter', 'Poséidon', 'Apollon'], expl: "Zeus, maître de la foudre, qui règne sur l'Olympe. Les Romains l'appelleront Jupiter." },

        { cat: 'Antiquité', prompt: "Selon la légende, qui a fondé Rome ?", answer: 'Romulus', faux: ['Jules César', 'Auguste', 'Rémus et Numa'], expl: "Romulus, qui aurait tué son frère Rémus lors de la fondation." },
        { cat: 'Antiquité', prompt: "En quelle année Rome aurait-elle été fondée ?", answer: '753 avant J.-C.', faux: ['27 avant J.-C.', '476 après J.-C.', '1000 avant J.-C.'], expl: "753 avant J.-C., selon la légende : les Romains comptaient les années à partir de cette date." },
        { cat: 'Antiquité', prompt: "Qui devient le premier empereur romain en 27 avant J.-C. ?", answer: 'Auguste', faux: ['Jules César', 'Néron', 'Romulus'], expl: "Auguste, petit-neveu de Jules César : la République laisse place à l'Empire." },

        { cat: 'Antiquité', prompt: "À Athènes, qui pouvait voter ?", answer: 'Les citoyens hommes seulement', faux: ['Tous les habitants', 'Les femmes seulement', 'Les esclaves aussi'], expl: "Seuls les hommes libres nés de parents athéniens : femmes, esclaves et étrangers en étaient exclus." },

    { id: 'hist-empire-romain', title: "L'Empire romain", explanation: "Un empire immense autour de la Méditerranée, et la naissance du christianisme.", levels: ['sixieme'],
      cours: [
        "À son apogée, au <strong>IIe siècle après Jésus-Christ</strong>, l'<strong>Empire romain</strong> entoure toute la <strong>mer Méditerranée</strong>, que les Romains appellent <em>Mare Nostrum</em>, « notre mer ». Sa capitale est <strong>Rome</strong>.",
        "Pour tenir cet empire, les Romains construisent un immense réseau de <strong>routes</strong>, des <strong>aqueducs</strong> qui amènent l'eau dans les villes, des <strong>thermes</strong>, des <strong>amphithéâtres</strong> comme le <strong>Colisée</strong> et des <strong>arcs de triomphe</strong>.",
        "La <strong>Gaule</strong> est conquise par <strong>Jules César</strong>, qui bat le chef gaulois <strong>Vercingétorix</strong> à <strong>Alésia</strong> en <strong>52 avant Jésus-Christ</strong>. Les Gaulois adoptent peu à peu le mode de vie romain : c'est la <strong>romanisation</strong>.",
        "Le <strong>christianisme</strong> naît en Palestine au Ier siècle. D'abord persécuté, il devient autorisé, puis la religion officielle de l'Empire à la fin du IVe siècle. L'Empire romain d'Occident s'effondre en <strong>476</strong>, ce qui marque la fin de l'Antiquité."

      reperes: [['-52', 'Alésia : César bat Vercingétorix'], ['Ier siècle', 'Naissance du christianisme'], ['IIe siècle', "Apogée de l'Empire romain"], ['476', "Chute de l'Empire romain d'Occident"]],
      question() { return questionDeBanque([
        { cat: 'Empire romain', prompt: "Quelle mer l'Empire romain entoure-t-il entièrement ?", answer: 'La Méditerranée', faux: ["L'Atlantique", 'La mer Noire', 'La mer du Nord'], expl: "La Méditerranée, que les Romains appelaient Mare Nostrum, « notre mer »." },
        { cat: 'Empire romain', prompt: "Quel général romain conquiert la Gaule ?", answer: 'Jules César', faux: ['Auguste', 'Vercingétorix', 'Romulus'], expl: "Jules César, entre 58 et 51 avant J.-C." },
        { cat: 'Empire romain', prompt: "Quel chef gaulois est vaincu à Alésia ?", answer: 'Vercingétorix', faux: ['Astérix', 'Brennus', 'Clovis'], expl: "Vercingétorix, qui avait réuni les peuples gaulois contre César." },
        { cat: 'Empire romain', prompt: "En quelle année a lieu la bataille d'Alésia ?", answer: '52 avant J.-C.', faux: ['476 après J.-C.', '753 avant J.-C.', '27 avant J.-C.'], expl: "En 52 avant J.-C. : la Gaule devient romaine." },
        { cat: 'Empire romain', prompt: "À quoi servaient les aqueducs romains ?", answer: "À amener l'eau dans les villes", faux: ['À faire passer les armées', 'À défendre les frontières', 'À stocker le grain'], expl: "À conduire l'eau des sources jusqu'aux villes, parfois sur des dizaines de kilomètres." },
        { cat: 'Empire romain', prompt: "Comment s'appelle le grand amphithéâtre de Rome ?", answer: 'Le Colisée', faux: ['Le Panthéon', 'Le Forum', "L'Acropole"], expl: "Le Colisée, où se déroulaient combats de gladiateurs et spectacles." },
        { cat: 'Empire romain', prompt: "Comment appelle-t-on l'adoption du mode de vie romain par les Gaulois ?", answer: 'La romanisation', faux: ['La colonisation', 'La christianisation', 'La migration'], expl: "La romanisation : langue latine, villes, thermes et routes s'imposent peu à peu." },
        { cat: 'Empire romain', prompt: "Où naît le christianisme au Ier siècle ?", answer: 'En Palestine', faux: ['À Rome', 'En Grèce', 'En Gaule'], expl: "En Palestine, alors province de l'Empire romain." },
        { cat: 'Empire romain', prompt: "En quelle année tombe l'Empire romain d'Occident ?", answer: '476', faux: ['52 avant J.-C.', '1492', '800'], expl: "En 476 : cette date marque la fin de l'Antiquité." },
        { cat: 'Empire romain', prompt: "Quelle est la capitale de l'Empire romain ?", answer: 'Rome', faux: ['Athènes', 'Constantinople', 'Alexandrie'], expl: "Rome, d'où partaient toutes les routes de l'Empire." },
        { cat: 'Empire romain', prompt: "Quel événement marque la fin de l'Antiquité ?", answer: "La chute de l'Empire romain d'Occident", faux: ["L'invention de l'écriture", 'La bataille d\'Alésia', 'La fondation de Rome'], expl: "La chute de l'Empire romain d'Occident en 476." }
      ]); } }
  ] },

      question() { return questionDeBanque([

    { id: 'geo-metropole', title: 'Habiter une métropole', explanation: "Les très grandes villes du monde : leur organisation, leurs atouts et leurs difficultés.", levels: ['sixieme'],
      cours: [

        "Une métropole s'organise en quartiers : le <strong>centre-ville</strong> ancien, un quartier <strong>d'affaires</strong> avec ses tours, des quartiers d'habitation, puis les <strong>banlieues</strong> et l'espace <strong>périurbain</strong>.",
        "Les métropoles offrent beaucoup de services : universités, hôpitaux, musées, aéroports. Mais elles connaissent aussi des difficultés : <strong>embouteillages</strong>, <strong>pollution</strong>, logements chers et fortes <strong>inégalités</strong> entre quartiers.",
        "Dans les pays pauvres, une partie des habitants vit dans des <strong>bidonvilles</strong>, des quartiers construits sans plan ni équipements. <strong>Tokyo</strong>, <strong>New York</strong>, <strong>Shanghai</strong>, <strong>Lagos</strong> et <strong>Paris</strong> sont des métropoles."
      ],
      reperes: [['Métropole', 'Grande ville qui concentre et rayonne'], ['Quartier d\'affaires', 'Les tours et les bureaux'], ['Bidonville', 'Habitat précaire, sans équipements'], ['Tokyo', "L'une des plus peuplées du monde"]],
      question() { return questionDeBanque([
        { cat: 'Métropole', prompt: "Qu'est-ce qu'une métropole ?", answer: 'Une grande ville qui concentre activités et décisions', faux: ['Un village agrandi', 'Une ville de bord de mer', 'Une capitale uniquement'], expl: "Une très grande ville qui concentre emplois, décisions et transports, et rayonne au loin." },
        { cat: 'Métropole', prompt: "Comment appelle-t-on le quartier des tours et des bureaux ?", answer: "Le quartier d'affaires", faux: ['Le centre historique', 'La banlieue', 'La zone industrielle'], expl: "Le quartier d'affaires, comme La Défense à Paris." },
        { cat: 'Métropole', prompt: "Quel problème est fréquent dans les métropoles ?", answer: 'Les embouteillages et la pollution', faux: ['Le manque de population', "L'absence de transports", 'Le manque de commerces'], expl: "La concentration de population entraîne embouteillages et pollution de l'air." },
        { cat: 'Métropole', prompt: "Comment appelle-t-on un quartier d'habitat précaire sans équipements ?", answer: 'Un bidonville', faux: ['Un écoquartier', 'Une banlieue résidentielle', 'Un centre-ville'], expl: "Un bidonville : construit sans plan, souvent sans eau courante ni électricité." },
        { cat: 'Métropole', prompt: "Laquelle de ces villes est une métropole mondiale ?", answer: 'Tokyo', faux: ['Chartres', 'Dinan', 'Guérande'], expl: "Tokyo et son agglomération comptent parmi les plus peuplées du monde." },
        { cat: 'Métropole', prompt: "Que trouve-t-on autour du centre d'une métropole ?", answer: 'Des banlieues et un espace périurbain', faux: ['Uniquement des champs', 'Des déserts', 'Rien du tout'], expl: "Des banlieues puis un espace périurbain, de moins en moins dense." },
        { cat: 'Métropole', prompt: "Pourquoi les logements sont-ils chers dans les métropoles ?", answer: 'La demande y est très forte', faux: ['Ils sont tous neufs', 'Il y a peu d\'habitants', 'Les terrains sont gratuits'], expl: "Beaucoup de gens veulent y habiter et la place est limitée : les prix montent." },
        { cat: 'Métropole', prompt: "Quel équipement relie une métropole au reste du monde ?", answer: "L'aéroport international", faux: ['La mairie', 'Le marché', "L'école primaire"], expl: "L'aéroport international, porte d'entrée des voyageurs et du fret." },
        { cat: 'Métropole', prompt: "Quelle est la métropole française la plus peuplée ?", answer: 'Paris', faux: ['Lille', 'Strasbourg', 'Rennes'], expl: "Paris et son agglomération, de loin la plus peuplée de France." },
        { cat: 'Métropole', prompt: "Que veut dire « une métropole rayonne » ?", answer: 'Son influence dépasse largement ses limites', faux: ['Elle est très éclairée la nuit', 'Elle est très ensoleillée', 'Elle est très étendue'], expl: "Son influence — économique, culturelle — dépasse largement ses limites administratives." }
      ]); } },

    { id: 'geo-littoral', title: 'Habiter les littoraux', explanation: "Les bords de mer : tourisme, pêche, ports et fragilité des milieux.", levels: ['sixieme'],
      cours: [
        "Le <strong>littoral</strong> est la zone de contact entre la <strong>terre</strong> et la <strong>mer</strong>. C'est un espace très attractif : partout dans le monde, les populations s'y concentrent.",
        "On distingue les <strong>littoraux touristiques</strong>, avec leurs plages, leurs hôtels et leurs ports de plaisance, et les <strong>littoraux industrialo-portuaires</strong>, où les grands <strong>ports</strong> reçoivent les porte-conteneurs et où s'installent usines et raffineries.",
        "La <strong>pêche</strong> reste une activité importante, mais la <strong>surpêche</strong> menace les ressources : on prélève parfois plus de poissons que la mer ne peut en produire.",
        "Les littoraux sont <strong>fragiles</strong>. Ils subissent l'<strong>érosion</strong>, la <strong>pollution</strong>, le bétonnage des côtes et la <strong>montée du niveau de la mer</strong> liée au réchauffement climatique. Des espaces protégés sont créés pour les préserver."
      ],
      reperes: [['Littoral', 'Contact entre la terre et la mer'], ['Industrialo-portuaire', 'Grands ports, usines, raffineries'], ['Surpêche', 'Prélever plus que la mer ne produit'], ['Érosion', 'Le recul du trait de côte']],
      question() { return questionDeBanque([
        { cat: 'Littoraux', prompt: "Qu'est-ce qu'un littoral ?", answer: 'La zone de contact entre la terre et la mer', faux: ['Une chaîne de montagnes', 'Un fleuve large', 'Une grande plaine'], expl: "La bande où la terre rencontre la mer : plages, falaises, ports, estuaires." },
        { cat: 'Littoraux', prompt: "Quelle activité domine sur un littoral touristique ?", answer: 'Le tourisme balnéaire', faux: ["L'industrie lourde", "L'élevage", "L'exploitation minière"], expl: "Le tourisme balnéaire : plages, hôtels, ports de plaisance." },
        { cat: 'Littoraux', prompt: "Que reçoivent les grands ports de commerce ?", answer: 'Des porte-conteneurs', faux: ['Des avions', 'Des trains à grande vitesse', 'Des voitures particulières'], expl: "Des porte-conteneurs, parfois longs de 400 mètres." },
        { cat: 'Littoraux', prompt: "Qu'est-ce que la surpêche ?", answer: 'Prélever plus de poissons que la mer n\'en produit', faux: ['Pêcher uniquement l\'été', 'Pêcher à la ligne', 'Élever des poissons'], expl: "Prélever plus de poissons que la mer n'en produit : les stocks s'épuisent." },
        { cat: 'Littoraux', prompt: "Comment appelle-t-on le recul progressif de la côte ?", answer: "L'érosion", faux: ['La marée', 'La sédimentation', 'La pollution'], expl: "L'érosion : vagues et courants arrachent peu à peu le trait de côte." },
        { cat: 'Littoraux', prompt: "Quel phénomène climatique menace les littoraux ?", answer: 'La montée du niveau de la mer', faux: ['La baisse des marées', 'Le refroidissement', 'La fonte des fleuves'], expl: "La montée du niveau de la mer, due au réchauffement, submerge les côtes basses." },
        { cat: 'Littoraux', prompt: "Pourquoi les populations se concentrent-elles sur les littoraux ?", answer: 'Ce sont des espaces attractifs et bien reliés', faux: ['Le climat y est toujours froid', 'Les terres y sont gratuites', 'Il n\'y a pas de risques'], expl: "Les littoraux offrent ports, échanges, climat agréable et emplois." },
        { cat: 'Littoraux', prompt: "Comment appelle-t-on un littoral où se trouvent usines et grand port ?", answer: 'Un littoral industrialo-portuaire', faux: ['Un littoral balnéaire', 'Un littoral protégé', 'Un littoral rural'], expl: "Un littoral industrialo-portuaire, comme celui du Havre ou de Marseille-Fos." },
        { cat: 'Littoraux', prompt: "Que construit-on parfois trop sur les côtes, au détriment des milieux ?", answer: 'Des immeubles et des routes', faux: ['Des forêts', 'Des dunes', 'Des récifs'], expl: "Immeubles et routes bétonnent le littoral et détruisent dunes et marais." },
        { cat: 'Littoraux', prompt: "Comment protège-t-on les milieux littoraux fragiles ?", answer: 'En créant des espaces protégés', faux: ['En construisant davantage', 'En augmentant la pêche', 'En supprimant les plages'], expl: "Par des espaces protégés, où la construction et la fréquentation sont limitées." }
      ]); } },

    { id: 'geo-faible-densite', title: 'Les espaces de faible densité', explanation: "Campagnes, montagnes et déserts : vivre là où il y a peu d'habitants.", levels: ['sixieme'],

        "Ces espaces sont variés : campagnes agricoles, <strong>montagnes</strong>, forêts, <strong>déserts</strong> chauds ou froids. On les appelle parfois les <strong>marges</strong>, car ils sont à l'écart des grands centres.",
        "On y vit de l'<strong>agriculture</strong>, de l'<strong>élevage</strong>, de l'exploitation de la forêt, parfois du <strong>tourisme</strong> — sports d'hiver en montagne, tourisme vert à la campagne.",
        "Les habitants y font face à des difficultés : <strong>distances</strong> importantes, fermeture de commerces et d'écoles, accès plus difficile aux soins. Certains de ces espaces se repeuplent pourtant, grâce au <strong>télétravail</strong> et à la recherche d'un cadre de vie plus calme."
      ],
      reperes: [['Densité', 'Habitants par kilomètre carré'], ['Marges', 'Espaces à l\'écart des grands centres'], ['Tourisme vert', 'Une ressource pour les campagnes'], ['Télétravail', 'Il permet de vivre loin des villes']],
      question() { return questionDeBanque([
        { cat: 'Faible densité', prompt: "Comment calcule-t-on la densité de population ?", answer: 'Nombre d\'habitants par km²', faux: ['Nombre d\'habitants par maison', 'Nombre de villes par région', 'Nombre de km² par habitant'], expl: "On divise le nombre d'habitants par la surface en kilomètres carrés." },
        { cat: 'Faible densité', prompt: "Lequel de ces espaces est de faible densité ?", answer: 'Un désert', faux: ['Une métropole', 'Un quartier d\'affaires', 'Une banlieue'], expl: "Un désert : conditions extrêmes, donc très peu d'habitants." },
        { cat: 'Faible densité', prompt: "Quelle activité fait vivre les espaces ruraux ?", answer: "L'agriculture et l'élevage", faux: ['La finance', "L'industrie automobile", 'Le transport aérien'], expl: "L'agriculture et l'élevage, parfois complétés par le tourisme." },
        { cat: 'Faible densité', prompt: "Quelle difficulté rencontrent les habitants de ces espaces ?", answer: "L'éloignement des services", faux: ['Le trop-plein de commerces', 'Les embouteillages', 'Le manque de place'], expl: "Tout est loin : école, médecin, commerces. Il faut souvent la voiture." },
        { cat: 'Faible densité', prompt: "Quel tourisme se développe en montagne l'hiver ?", answer: 'Les sports d\'hiver', faux: ['Le tourisme balnéaire', 'Le tourisme urbain', 'Les croisières'], expl: "Les sports d'hiver font vivre les stations et les vallées." },
        { cat: 'Faible densité', prompt: "Qu'est-ce qui permet aujourd'hui de travailler loin des villes ?", answer: 'Le télétravail', faux: ["L'autoroute", 'Le TGV uniquement', "L'aviation"], expl: "Le télétravail, rendu possible par Internet." },
        { cat: 'Faible densité', prompt: "Comment appelle-t-on ces espaces à l'écart des grands centres ?", answer: 'Des marges', faux: ['Des métropoles', 'Des littoraux', 'Des capitales'], expl: "Les marges : à l'écart des flux et des grandes concentrations." },
        { cat: 'Faible densité', prompt: "Un désert froid est-il un espace de faible densité ?", answer: 'Oui', faux: ['Non, il est très peuplé', 'Seulement en été', 'Cela dépend du pays'], expl: "Oui : au Groenland ou en Sibérie, les conditions rendent l'installation très difficile." },
        { cat: 'Faible densité', prompt: "Qu'est-ce que le tourisme vert ?", answer: 'Un tourisme à la campagne, proche de la nature', faux: ['Un tourisme dans les grandes villes', 'Un tourisme en bord de mer', 'Un tourisme industriel'], expl: "Un tourisme à la campagne, tourné vers la nature et le patrimoine rural." },
        { cat: 'Faible densité', prompt: "Que ferme-t-on parfois faute d'habitants dans ces espaces ?", answer: 'Des écoles et des commerces', faux: ['Des aéroports', 'Des universités', 'Des ports'], expl: "Quand la population baisse, écoles et commerces ferment, ce qui accélère le départ." }
      ]); } },

    { id: 'geo-monde-habite', title: 'Le monde habité', explanation: "Où vivent les humains sur la planète, et pourquoi si inégalement.", levels: ['sixieme'],
      cours: [
        "La Terre compte aujourd'hui environ <strong>8 milliards d'habitants</strong>. Ils sont très inégalement répartis : certaines régions sont surpeuplées, d'autres presque vides.",
        "Les grands <strong>foyers de peuplement</strong> sont l'<strong>Asie de l'Est</strong> (Chine, Japon), l'<strong>Asie du Sud</strong> (Inde), l'<strong>Europe</strong> et le <strong>nord-est de l'Amérique du Nord</strong>. L'<strong>Asie</strong> est de loin le continent le plus peuplé.",
        "À l'inverse, les <strong>déserts</strong> chauds ou froids, les <strong>hautes montagnes</strong> et les grandes <strong>forêts</strong> sont très peu habités : ce sont des espaces aux contraintes fortes.",
        "Les océans couvrent la plus grande partie de la planète. Le plus vaste est l'<strong>océan Pacifique</strong>. Aujourd'hui, plus de la moitié de l'humanité vit en <strong>ville</strong> : c'est l'<strong>urbanisation</strong>."
      ],
      reperes: [['8 milliards', "Population mondiale actuelle"], ['Asie', 'Le continent le plus peuplé'], ['Pacifique', 'Le plus grand océan'], ['Urbanisation', 'Plus d\'un humain sur deux vit en ville']],
      question() { return questionDeBanque([
        { cat: 'Monde habité', prompt: "Combien d'habitants compte la Terre aujourd'hui ?", answer: 'Environ 8 milliards', faux: ['Environ 1 milliard', 'Environ 800 millions', 'Environ 50 milliards'], expl: "Environ 8 milliards, contre 2,5 milliards en 1950." },
        { cat: 'Monde habité', prompt: "Quel est le continent le plus peuplé ?", answer: "L'Asie", faux: ["L'Afrique", "L'Europe", "L'Amérique"], expl: "L'Asie rassemble à elle seule plus de la moitié de l'humanité." },
        { cat: 'Monde habité', prompt: "Comment appelle-t-on une région du monde très peuplée ?", answer: 'Un foyer de peuplement', faux: ['Un désert humain', 'Une marge', 'Un littoral'], expl: "Un foyer de peuplement : Asie de l'Est, Asie du Sud, Europe, nord-est de l'Amérique du Nord." },
        { cat: 'Monde habité', prompt: "Quel est le plus grand océan de la planète ?", answer: "L'océan Pacifique", faux: ["L'océan Atlantique", "L'océan Indien", "L'océan Arctique"], expl: "Le Pacifique couvre à lui seul environ un tiers de la surface du globe." },
        { cat: 'Monde habité', prompt: "Lequel de ces espaces est très peu habité ?", answer: 'Un désert', faux: ['Une plaine fertile', 'Un littoral tempéré', 'Une vallée fluviale'], expl: "Les déserts, trop secs ou trop froids, comptent très peu d'habitants." },
        { cat: 'Monde habité', prompt: "Où vit aujourd'hui plus de la moitié de l'humanité ?", answer: 'En ville', faux: ['À la campagne', 'En montagne', 'Sur les littoraux uniquement'], expl: "En ville : depuis 2007, les citadins sont plus nombreux que les ruraux." },
        { cat: 'Monde habité', prompt: "Comment appelle-t-on l'augmentation de la population des villes ?", answer: "L'urbanisation", faux: ["L'exode urbain", 'La densification agricole', 'La migration saisonnière'], expl: "L'urbanisation : les villes grandissent et concentrent toujours plus d'habitants." },

        { cat: 'Monde habité', prompt: "Pourquoi les hautes montagnes sont-elles peu peuplées ?", answer: 'Les conditions de vie y sont difficiles', faux: ['Il y fait trop chaud', 'Les terres y sont trop riches', 'Elles sont interdites'], expl: "Froid, pente, air raréfié et terres peu cultivables rendent la vie difficile." },
        { cat: 'Monde habité', prompt: "La population mondiale est-elle répartie de façon égale ?", answer: 'Non, très inégalement', faux: ['Oui, partout pareil', 'Oui, sauf en Europe', 'Oui, depuis 2000'], expl: "Non : des régions entières sont presque vides, d'autres très denses." }
