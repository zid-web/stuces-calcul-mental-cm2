<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
  :root {
    --purple: #5B4FE8; --purple-dark: #3C3489;
    --bg: #F6F5FF; --card: #FFFFFF; --text: #232134; --text-secondary: #6B6880;
    --success: #1D9E75; --success-bg: #E1F5EE;
    --danger: #D85A30; --danger-bg: #FAECE7;
    --warning: #BA7517; --warning-bg: #FAEEDA;
    --border: #E4E2F1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #app { min-height: 100vh; min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + var(--install-offset, 0px)) env(safe-area-inset-left); display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; padding: 1.25rem 1rem 2rem; max-width: 480px; margin: 0 auto; width: 100%; }

  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.3rem; }
  .subtitle { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 1.1rem; }

  .level-switch { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 1.2rem; }
  .level-btn { flex: 1; padding: 0.6rem; border: none; border-radius: 9px; background: transparent; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary); }
  .level-btn.active { background: var(--purple); color: white; }

  .mode-card, .trick-card { display: flex; align-items: center; gap: 0.9rem; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.95rem 1rem; margin-bottom: 9px; cursor: pointer; }
  .mode-card:active, .trick-card:active { transform: scale(0.98); }
  .mode-emoji, .trick-emoji { font-size: 1.7rem; flex-shrink: 0; }
  .mode-info, .trick-info { flex: 1; min-width: 0; }
  .mode-title, .trick-title { font-weight: 600; font-size: 0.95rem; }
  .mode-desc { font-size: 0.78rem; color: var(--text-secondary); }
  .mode-arrow { font-size: 1.2rem; color: var(--purple); flex-shrink: 0; }
  .trick-progress { font-size: 0.72rem; color: var(--success); font-weight: 600; margin-top: 2px; }

  .btn { padding: 1rem; border-radius: 14px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--purple); color: white; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  /* un bouton indisponible doit se voir : sinon l'enfant appuie dans le vide */
  .btn:disabled, .btn-pause:disabled, .vitesse-btn:disabled { opacity: 0.4; cursor: default; }
  .btn-back { background: transparent; border: none; color: var(--purple); font-weight: 600; font-size: 0.92rem; padding: 0.5rem 0; margin-bottom: 0.3rem; align-self: flex-start; cursor: pointer; }

  .vitesse-btn { border: 1px solid var(--border); background: transparent; color: var(--text-secondary); border-radius: 8px; padding: 0.28rem 0.6rem; font-weight: 700; font-size: 0.78rem; cursor: pointer; }

  .hamster-note { font-size: 0.85rem; opacity: 0.9; margin-top: 0.3rem; line-height: 1.4; }
  .quiz-progress { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
  .quiz-score { font-size: 1.1rem; font-weight: 700; }

  .timer-bar-bg { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
  .timer-bar-fill { height: 100%; background: var(--purple); border-radius: 4px; transition: width 0.9s linear, background-color 0.3s; }
  .timer-bar-fill.low { background: var(--danger); }
  .timer-num { font-size: 0.76rem; color: var(--text-secondary); text-align: right; }

  .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem 1.1rem; text-align: center; margin-bottom: 1.1rem; }
  .question-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.7rem; }
  .question-formula { font-size: 1.9rem; font-weight: 700; }
  .question-shape { display: flex; justify-content: center; margin: 0.7rem 0; }
  .question-shape svg { max-width: 100%; height: auto; }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .option-btn { padding: 0.95rem; font-size: 1rem; font-weight: 700; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .option-btn.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .option-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

  .results-emoji { font-size: 3.2rem; text-align: center; margin: 0.8rem 0; }
  .results-title { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 1.1rem; }
  .results-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
  .results-score { font-size: 2.1rem; font-weight: 700; color: var(--purple); margin: 0.3rem 0; }
  .results-meta { font-size: 0.83rem; color: var(--text-secondary); }
  .verdict-box { padding: 1rem; border-radius: 14px; margin-bottom: 1rem; font-size: 0.88rem; line-height: 1.4; }
  .verdict-good { background: var(--success-bg); color: var(--success); }
  .verdict-mid { background: var(--warning-bg); color: var(--warning); }
  .verdict-low { background: var(--danger-bg); color: var(--danger); }
  .breakdown-list { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem 1rem; margin-bottom: 1.1rem; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.86rem; border-bottom: 1px solid var(--border); }
  .breakdown-row:last-child { border-bottom: none; }

  .install-banner { position: fixed; bottom: 0; left: 0; right: 0; background: var(--purple); color: white; padding: 1rem 1.2rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 1rem; z-index: 100; }
  .install-banner button { padding: 0.6rem 1rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
  .install-banner .install-btn { background: white; color: var(--purple); }
  .install-banner .dismiss-btn { background: transparent; color: white; opacity: 0.8; }
  .install-text { flex: 1; font-size: 0.9rem; }
  .install-help { display: block; font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }
</style>

<body>
<div id="app"></div>
<script>
/* ================= Utils ================= */
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function rndMultiple(minMult, maxMult, step) { return rnd(minMult, maxMult) * step; }
function shuffle(arr) { return arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]); }
function formatNum(n) {
  const r = Math.round(n * 100) / 100;
  const s = (r % 1 === 0) ? String(r) : String(r);
  return s.replace('.', ',');
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function isPrime(n) { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function numericOptions(answer, decimals) {
  const opts = new Set([answer]);
  let guard = 0;
  while (opts.size < 4 && guard < 40) {
    guard++;
    const delta = decimals > 0 ? (Math.random() < 0.5 ? -1 : 1) * (Math.round((Math.random() * 3 + 0.5) * 10) / 10) : (Math.random() < 0.5 ? -1 : 1) * rnd(1, 8);
    let v = decimals > 0 ? Math.round((answer + delta) * 10) / 10 : Math.round(answer + delta);
    if (!isNaN(v)) opts.add(v);
  }
  return shuffle([...opts]);
}
/* Des propositions de secours construites à partir de la réponse : un chiffre
   voisin, un numérateur ou un dénominateur décalé. Sert quand les distracteurs
   fournis se doublonnent ou tombent sur la bonne réponse. */
function variantes(correct) {
  const frac = /^(\d+)\/(\d+)$/.exec(correct);
  if (frac) {
    const a = +frac[1], b = +frac[2], out = [];
    for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1], [-1, 1], [2, 0], [0, 2]]) {
      const na = a + da, nb = b + db;
      if (na > 0 && nb > 1 && na < nb) out.push(`${na}/${nb}`);
    }
    return out;
  }
  const n = parseFloat(String(correct).replace(',', '.'));
  if (!isNaN(n) && String(correct).match(/^-?\d/)) {
    const dec = String(correct).includes(',') ? 1 : 0;
    return [1, -1, 2, -2, 3, -3].map(d => n + d).filter(v => v > 0)
      .map(v => formatNum(dec ? Math.round(v * 10) / 10 : v));
  }
  return [];
}

function mkOptions(correct, distractors) {
  const uniq = [];
  const ajouter = (d) => { if (d !== correct && !uniq.includes(d) && uniq.length < 3) uniq.push(d); };
  distractors.forEach(ajouter);
  /* plutôt que de compléter avec du remplissage absurde (« 2/5_2 »), on
     fabrique des variantes ; et s'il en manque encore, on propose moins de choix */
  variantes(correct).forEach(ajouter);
  return shuffle([correct, ...uniq]);
}
function loadStore() { try { return JSON.parse(localStorage.getItem('cm_store') || '{}'); } catch { return {}; } }
function saveStore(obj) { localStorage.setItem('cm_store', JSON.stringify(obj)); }
function saveBest(key, pct) { const s = loadStore(); s[key] = Math.max(s[key] || 0, pct); saveStore(s); }
function getBest(key) { return loadStore()[key]; }

/* ---------- Jetons chatons et récompenses hamster ---------- */
const SEUIL_JETON = 80;          // un quiz est réussi à partir de 80 % de bonnes réponses
const JETONS_PAR_HAMSTER = 10;   // dix chatons donnent un hamster

function getJetons() { return loadStore().jetons || 0; }
function getHamsters() { return loadStore().hamsters || 0; }

/* Appelée une seule fois, à la fin d'un quiz. Renvoie ce qui vient d'être
   gagné pour que l'écran de résultat puisse l'annoncer. */
function attribuerRecompense(pct) {
  if (pct < SEUIL_JETON) return { jeton: false, hamster: false, jetons: getJetons(), hamsters: getHamsters() };
  const s = loadStore();
  let jetons = (s.jetons || 0) + 1, hamsters = s.hamsters || 0, hamster = false;
  if (jetons >= JETONS_PAR_HAMSTER) { jetons -= JETONS_PAR_HAMSTER; hamsters++; hamster = true; }
  s.jetons = jetons; s.hamsters = hamsters; saveStore(s);
  return { jeton: true, hamster, jetons, hamsters };
}

/* ================= SVG helpers ================= */
function svgWrap(inner) { return `<svg viewBox="0 0 220 180" style="width:190px;height:auto;">${inner}</svg>`; }
function svgSquare(a) {
  return svgWrap(`<rect x="50" y="30" width="120" height="120" fill="none" stroke="#5B4FE8" stroke-width="4"/><text x="110" y="20" text-anchor="middle" font-size="15" fill="#232134">${formatNum(a)} cm</text>`);
}
function svgRectangle(L, l) {
  const w = Math.min(170, Math.max(70, L * 9)), h = Math.min(120, Math.max(40, l * 9));
  const x = (220 - w) / 2, y = (170 - h) / 2;
  return svgWrap(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#5B4FE8" stroke-width="4"/><text x="110" y="${y - 8}" text-anchor="middle" font-size="14" fill="#232134">${formatNum(L)} cm</text><text x="${x + w + 30}" y="${y + h / 2}" text-anchor="middle" font-size="14" fill="#232134">${formatNum(l)} cm</text>`);
}
function svgTriangleRight(base, hauteur) {
  const bw = Math.min(150, Math.max(70, base * 8)), bh = Math.min(120, Math.max(50, hauteur * 8));
  const x0 = (220 - bw) / 2, y0 = 150;
  return svgWrap(`<polygon points="${x0},${y0} ${x0 + bw},${y0} ${x0},${y0 - bh}" fill="none" stroke="#0F6E56" stroke-width="4"/><text x="${x0 + bw / 2}" y="${y0 + 18}" text-anchor="middle" font-size="14" fill="#232134">${formatNum(base)} cm</text><text x="${x0 - 12}" y="${y0 - bh / 2}" text-anchor="end" font-size="14" fill="#232134">${formatNum(hauteur)} cm</text>`);
}
function svgTrianglePerim(a, b, c) {
  return svgWrap(`<polygon points="40,150 180,150 100,30" fill="none" stroke="#0F6E56" stroke-width="4"/><text x="110" y="168" text-anchor="middle" font-size="13" fill="#232134">${formatNum(a)} cm</text><text x="150" y="90" text-anchor="middle" font-size="13" fill="#232134">${formatNum(b)} cm</text><text x="65" y="90" text-anchor="middle" font-size="13" fill="#232134">${formatNum(c)} cm</text>`);
}
function svgCircle(r) {
  const px = Math.min(70, Math.max(35, r * 6));
  return svgWrap(`<circle cx="110" cy="95" r="${px}" fill="none" stroke="#993C1D" stroke-width="4"/><line x1="110" y1="95" x2="${110 + px}" y2="95" stroke="#993C1D" stroke-width="2"/><text x="${110 + px / 2}" y="88" text-anchor="middle" font-size="13" fill="#232134">${formatNum(r)} cm</text>`);
}
function svgAngle(deg) {
  const vx = 60, vy = 150, ray = 110, rad = deg * Math.PI / 180;
  const x2 = vx + ray * Math.cos(rad), y2 = vy - ray * Math.sin(rad);
  return svgWrap(`<line x1="${vx}" y1="${vy}" x2="${vx + ray}" y2="${vy}" stroke="#534AB7" stroke-width="4"/><line x1="${vx}" y1="${vy}" x2="${x2}" y2="${y2}" stroke="#534AB7" stroke-width="4"/><path d="M ${vx + 26} ${vy} A 26 26 0 0 0 ${vx + 26 * Math.cos(rad)} ${vy - 26 * Math.sin(rad)}" fill="none" stroke="#D85A30" stroke-width="2"/>`);
}
function svgPolygon(n) {
  const cx = 110, cy = 95, R = 65; let pts = [];
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push(`${cx + R * Math.cos(a)},${cy + R * Math.sin(a)}`); }
  return svgWrap(`<polygon points="${pts.join(' ')}" fill="none" stroke="#185FA5" stroke-width="4"/>`);
}

function svgWide(inner, h) { return `<svg viewBox="0 0 300 ${h}" style="width:100%;max-width:280px;height:auto;">${inner}</svg>`; }

/* Le modèle en barres : une barre par personne, découpée en parts égales.
   `extra` ajoute un bloc distinct pour un écart (« 12 de plus »). */
function svgBarModel(rows, total) {
  const maxU = Math.max(...rows.map(r => r.units + (r.extra ? 1 : 0)));
  const x0 = 56, W = 172, u = W / maxU, bh = 24, gap = 12;
  let out = '', y = 12;
  rows.forEach(r => {
    out += `<text x="${x0 - 8}" y="${y + 17}" text-anchor="end" font-size="12" fill="#6B6880">${r.name}</text>`;
    for (let i = 0; i < r.units; i++) out += `<rect x="${x0 + i * u}" y="${y}" width="${u}" height="${bh}" fill="#EDEBFF" stroke="#5B4FE8" stroke-width="2"/>`;
    if (r.extra) out += `<rect x="${x0 + r.units * u}" y="${y}" width="${u}" height="${bh}" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/><text x="${x0 + (r.units + 0.5) * u}" y="${y + 17}" text-anchor="middle" font-size="11" font-weight="700" fill="#8A5510">${r.extra}</text>`;
    if (r.label) out += `<text x="${x0 + (r.units + (r.extra ? 1 : 0)) * u + 7}" y="${y + 17}" font-size="12" font-weight="700" fill="#5B4FE8">${r.label}</text>`;
    y += bh + gap;
  });
  if (total) {
    const tw = x0 + maxU * u;
    out += `<path d="M ${x0} ${y} L ${x0} ${y + 7} L ${tw} ${y + 7} L ${tw} ${y}" fill="none" stroke="#6B6880" stroke-width="2"/><text x="${(x0 + tw) / 2}" y="${y + 23}" text-anchor="middle" font-size="12" font-weight="700" fill="#232134">${total}</text>`;
    y += 28;
  }
  return svgWide(out, y + 4);
}

/* Cercle avec son rayon ou son diamètre tracé et légendé. */
function svgCircleLabeled(value, kind) {
  const R = 62, cx = 150, cy = 78;
  const trait = kind === 'diamètre'
    ? `<line x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="#D85A30" stroke-width="3"/>`
    : `<line x1="${cx}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="#D85A30" stroke-width="3"/>`;
  const tx = kind === 'diamètre' ? cx : cx + R / 2;
  return svgWide(`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#5B4FE8" stroke-width="4"/>${trait}<circle cx="${cx}" cy="${cy}" r="3" fill="#5B4FE8"/><text x="${tx}" y="${cy - 8}" text-anchor="middle" font-size="13" font-weight="700" fill="#232134">${value} cm</text>`, 156);
}

/* Pavé droit en perspective, chaque dimension légendée. */
function svgCuboid(L, l, h) {
  const x = 62, y = 44, w = 130, ht = 62, d = 30;
  return svgWide(`<polygon points="${x},${y + d} ${x + w},${y + d} ${x + w},${y + d + ht} ${x},${y + d + ht}" fill="#EDEBFF" stroke="#5B4FE8" stroke-width="3"/>
    <polygon points="${x},${y + d} ${x + d},${y} ${x + w + d},${y} ${x + w},${y + d}" fill="#DEDAFF" stroke="#5B4FE8" stroke-width="3"/>
    <polygon points="${x + w},${y + d} ${x + w + d},${y} ${x + w + d},${y + ht} ${x + w},${y + d + ht}" fill="#CFC9FF" stroke="#5B4FE8" stroke-width="3"/>
    <text x="${x + w / 2}" y="${y + d + ht + 18}" text-anchor="middle" font-size="12" fill="#232134">${L} cm</text>
    <text x="${x - 6}" y="${y + d + ht / 2 + 4}" text-anchor="end" font-size="12" fill="#232134">${h} cm</text>

/* Diagramme circulaire : parts = [{ label, frac }], fractions cumulant 1. */
function svgPie(parts) {
  const cx = 118, cy = 78, R = 62, teintes = ['#5B4FE8', '#1D9E75', '#D85A30', '#BA7517', '#8E86F0'];
  let a0 = -Math.PI / 2, out = '', ly = 26;
  parts.forEach((p, i) => {
    const a1 = a0 + p.frac * 2 * Math.PI, large = p.frac > 0.5 ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    out += `<path d="M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} Z" fill="${teintes[i % teintes.length]}" stroke="#FFFFFF" stroke-width="2"/>`;
    out += `<rect x="196" y="${ly - 9}" width="11" height="11" fill="${teintes[i % teintes.length]}"/><text x="213" y="${ly}" font-size="11" fill="#232134">${p.label}</text>`;
    a0 = a1; ly += 19;
  });

}

/* Des distracteurs proportionnels à la réponse : sur de grands nombres, un
   écart d'une ou deux unités rendrait le bon choix trop évident. */
function spreadOptions(answer, decimals) {
  const arrondi = (v) => decimals > 0 ? Math.round(v * 10) / 10 : Math.round(v);
  const pas = Math.max(decimals > 0 ? 0.5 : 1, arrondi(Math.abs(answer) * 0.12));
  const cible = arrondi(answer), opts = new Set([cible]);
  for (const d of shuffle([pas, -pas, 2 * pas, -2 * pas, 3 * pas])) {
    if (opts.size >= 4) break;
    const v = arrondi(answer + d);
    if (v > 0 && v !== cible) opts.add(v);
  }
  let k = 3; while (opts.size < 4) { opts.add(arrondi(answer + pas * ++k)); }
  return shuffle([...opts]).map(formatNum);
}

  { id: 'geographie', emoji: '🌍', title: 'Géographie', skills: [

function dicteesPourNiveau(niveau) { return DICTEES.filter(d => d.niveau === niveau); }

function getDomain(id) { return DOMAINS.find(d => d.id === id); }
function getSkill(domainId, skillId) { const d = getDomain(domainId); return d ? d.skills.find(s => s.id === skillId) : null; }
function skillsForLevel(domainId, level) { const d = getDomain(domainId); return d ? d.skills.filter(s => s.levels.includes(level)) : []; }
/* Un domaine sans compétence pour le niveau choisi n'a rien à montrer. Et sur
   le niveau Singapour, les domaines propres à la méthode passent devant : ce
   sont eux qu'on vient y chercher, pas les douze domaines communs. */
function domainesPourNiveau(level) {
  const dispo = DOMAINS.map(d => ({ d, n: skillsForLevel(d.id, level).length })).filter(x => x.n > 0);
  if (level !== 'singapour') return dispo;
  const propre = (x) => x.d.skills.every(s => s.levels.length === 1 && s.levels[0] === 'singapour');
  return [...dispo.filter(propre), ...dispo.filter(x => !propre(x))];
}

function setLevel(lvl) { state.level = lvl; const s = loadStore(); s.level = lvl; saveStore(s); render(); }
function clearTimer() { if (state.quiz && state.quiz.timerHandle) { clearInterval(state.quiz.timerHandle); state.quiz.timerHandle = null; } }

/* ================= Construction et moteur de quiz ================= */
/* Évite de retomber sur des questions identiques : on retente quelques fois,
   puis on accepte un doublon si le générateur a peu de combinaisons possibles. */
/* Histoire et géographie ne se génèrent pas : leurs questions sont écrites une
   à une dans une banque. On en tire au hasard, sans jamais reposer la même. */
function questionDeBanque(banque) {
  const b = banque[rnd(0, banque.length - 1)];
  return q({ category: b.cat, prompt: b.prompt, answer: b.answer, options: mkOptions(b.answer, b.faux), limit: b.limit || 25 });
}

function pickDistinct(makeFn, keyFn, count) {
  const out = [], seen = new Set();
  for (let i = 0; i < count; i++) {
    let item = makeFn(), key = keyFn(item);
    for (let a = 0; a < 20 && seen.has(key); a++) { item = makeFn(); key = keyFn(item); }
    seen.add(key); out.push(item);
  }
  return out;
}
const questionKey = (q) => [q.formula, q.prompt, q.svg, q.answer].join('|');
/* Pour les exemples d'une leçon on ignore le dessin : deux exemples de réponses
   différentes (angle aigu puis obtus, par exemple) sont plus parlants. */
const lessonKey = (q) => [q.formula, q.prompt, q.answer].join('|');
function buildMentalQuiz(trickId, count) {
  const trick = getTrick(trickId); const qs = [];
  for (const ex of pickDistinct(() => trick.gen(state.level), (e) => e.formula, count)) { const decimals = ex.result % 1 !== 0 ? 1 : 0; qs.push({ category: trick.title, prompt: "Utilise l'astuce !", unit: '', svg: null, formula: ex.formula, answer: formatNum(ex.result), options: numericOptions(ex.result, decimals).map(formatNum), limit: 15 }); }
  return qs;
}
function buildSkillQuiz(domainId, skillId, count) {
  const skill = getSkill(domainId, skillId);
  return pickDistinct(() => skill.question(state.level), questionKey, count);
}
function startQuiz(kind, builderFn, bestKey) {
  clearTimer();
  const questions = builderFn();
  state.quiz = { kind, rebuild: builderFn, bestKey, index: 0, score: 0, questions, answered: false, lastChosen: null, timeLeft: questions[0].limit, timerHandle: null, times: [], catStats: {}, pause: false, gain: null };
  state.screen = 'quiz'; render(); runTimer();
}
function runTimer() {
  clearTimer();
  state.quiz.timerHandle = setInterval(() => {
    if (!state.quiz || state.quiz.answered || state.quiz.pause) return;
    state.quiz.timeLeft--;
    if (state.quiz.timeLeft <= 0) { clearTimer(); answerQuiz(null); } else render();
  }, 1000);
}
function answerQuiz(chosen) {
  const qz = state.quiz; const cur = qz.questions[qz.index];
  if (qz.answered) return;
  qz.answered = true; clearTimer();
  const correct = chosen !== null && chosen === cur.answer;
  const timeUsed = cur.limit - qz.timeLeft; qz.times.push(timeUsed);
  if (!qz.catStats[cur.category]) qz.catStats[cur.category] = { correct: 0, total: 0 };
  qz.catStats[cur.category].total++;
  if (correct) { qz.score++; qz.catStats[cur.category].correct++; }
  render();
  setTimeout(() => {
    if (qz.index < qz.questions.length - 1) { qz.index++; qz.answered = false; qz.lastChosen = null; qz.timeLeft = qz.questions[qz.index].limit; render(); runTimer(); }
    else {
      const total = qz.questions.length; const pct = Math.round((qz.score / total) * 100);
      if (qz.bestKey) saveBest(qz.bestKey, pct);
      qz.gain = attribuerRecompense(pct);
      state.screen = 'quizResults'; render();
    }
  }, 1100);
}


/* ---------- La voix ---------- */
/* Les voix du navigateur arrivent de façon asynchrone : tant qu'elles ne sont
   pas chargées, getVoices() renvoie une liste vide. On réaffiche l'écran dès
   qu'elles arrivent pour que le bouton « Écouter » cesse d'être grisé. */
let voixPretes = false;
function voixFrancaise() {
  if (!('speechSynthesis' in window)) return null;
  const voix = speechSynthesis.getVoices();
  return voix.find(v => v.lang === 'fr-FR') || voix.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || null;
}
function lectureDisponible() { return 'speechSynthesis' in window && voixFrancaise() !== null; }
if ('speechSynthesis' in window) {
  speechSynthesis.addEventListener('voiceschanged', () => {
    voixPretes = true;
    if (state.screen === 'dictee') render();
  });
}

function direTexte(texte, vitesse) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = 'fr-FR';
  /* Choisir la voix est un confort, pas une nécessité : si l'appareil refuse
     celle qu'on lui propose, on lit quand même avec la voix par défaut plutôt
     que de laisser l'enfant devant un bouton muet. */
  try { const v = voixFrancaise(); if (v) u.voice = v; } catch (e) { /* voix par défaut */ }
  u.rate = vitesse;      // 0.7 en lecture lente, 0.95 en normale
  speechSynthesis.speak(u);
}
function stopperVoix() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ---------- Découpage et comparaison ---------- */
function phrasesDe(texte) {
  return texte.match(/[^.!?…]+[.!?…]*/g).map(s => s.trim()).filter(Boolean);
}
function motsDe(texte) { return texte.trim().split(/\s+/).filter(Boolean); }

/* La ponctuation n'est pas comptée comme faute, mais les accents et les
   majuscules le sont : c'est ce qui fait tout l'intérêt d'une dictée. */
function normaliserMot(mot) {
  return mot.replace(/[’ʼ]/g, "'")          // apostrophe typographique
            .replace(/^[«»"'“”(\[]+/, '')
            .replace(/[.,;:!?…«»"'“”)\]]+$/, '');
}

/* Alignement par plus longue sous-suite commune : il repère les mots oubliés
   et les mots en trop au lieu de tout décaler après la première erreur. */
function alignerMots(attendus, ecrits) {
  const n = attendus.length, m = ecrits.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = attendus[i] === ecrits[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const brut = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (attendus[i] === ecrits[j]) brut.push({ type: 'ok', a: i++, e: j++ });
    else if (dp[i + 1][j] >= dp[i][j + 1]) brut.push({ type: 'oubli', a: i++ });
    else brut.push({ type: 'ajout', e: j++ });
  }
  while (i < n) brut.push({ type: 'oubli', a: i++ });
  while (j < m) brut.push({ type: 'ajout', e: j++ });

  /* Un mot oublié qui fait face à un mot en trop, c'est en réalité un mot mal
     écrit. On traite chaque série d'erreurs d'un bloc et on apparie dans
     l'ordre : sinon, sur deux erreurs qui se suivent, le mot saisi se
     retrouverait confronté au mot attendu de l'erreur voisine. */
  const res = [];
  for (let k = 0; k < brut.length; ) {
    if (brut[k].type === 'ok') { res.push(brut[k++]); continue; }
    let fin = k;
    while (fin < brut.length && brut[fin].type !== 'ok') fin++;
    const serie = brut.slice(k, fin);
    const oublis = serie.filter(x => x.type === 'oubli'), ajouts = serie.filter(x => x.type === 'ajout');
    const paires = Math.min(oublis.length, ajouts.length);
    for (let i = 0; i < paires; i++) res.push({ type: 'faute', a: oublis[i].a, e: ajouts[i].e });
    for (let i = paires; i < oublis.length; i++) res.push(oublis[i]);
    for (let i = paires; i < ajouts.length; i++) res.push(ajouts[i]);
    k = fin;
  }
  return res;
}

/* Un signe de ponctuation isolé (« ! » précédé d'une espace) n'est pas un mot :
   comme la ponctuation est tolérée, il ne doit pas compter comme mot en trop. */
function motsComparables(texte) {
  const out = [];
  for (const mot of motsDe(texte)) { const n = normaliserMot(mot); if (n) out.push({ mot, n }); }
  return out;
}

function corrigerDictee(attendu, saisi) {
  const A = motsComparables(attendu), E = motsComparables(saisi);
  const align = alignerMots(A.map(x => x.n), E.map(x => x.n));
  const justes = align.filter(x => x.type === 'ok').length;
  const total = A.length;
  return { align, motsAttendus: A.map(x => x.mot), motsEcrits: E.map(x => x.mot), justes, total, pct: total ? Math.round(justes / total * 100) : 0 };
}

  const d = getDictee(state.dictee.id);
  const r = state.dictee.resultat;
  const emoji = r.pct === 100 ? '🏆' : r.pct >= 80 ? '🌟' : r.pct >= 50 ? '👍' : '💪';
  const titre = r.pct === 100 ? 'Sans faute !' : r.pct >= 80 ? 'Très bien !' : r.pct >= 50 ? 'Bon travail' : "Continue à t'entraîner";

  const morceaux = r.align.map(x => {
    if (x.type === 'ok') return `<span class="mot ok">${r.motsAttendus[x.a]}</span>`;
    if (x.type === 'faute') return `<span class="mot faute"><s>${r.motsEcrits[x.e]}</s> ${r.motsAttendus[x.a]}</span>`;
    if (x.type === 'oubli') return `<span class="mot oubli">${r.motsAttendus[x.a]}</span>`;
    return `<span class="mot ajout"><s>${r.motsEcrits[x.e]}</s></span>`;
  }).join(' ');

  const fautes = r.align.filter(x => x.type === 'faute').length;
  const oublis = r.align.filter(x => x.type === 'oubli').length;
  const ajouts = r.align.filter(x => x.type === 'ajout').length;
  const detail = [
    fautes ? `${fautes} mot${fautes > 1 ? 's' : ''} mal écrit${fautes > 1 ? 's' : ''}` : '',
    oublis ? `${oublis} oubli${oublis > 1 ? 's' : ''}` : '',
    ajouts ? `${ajouts} mot${ajouts > 1 ? 's' : ''} en trop` : ''
  ].filter(Boolean).join(' · ') || 'Aucune erreur';

  return `<div class="screen">
    <div class="results-emoji">${emoji}</div><div class="results-title">${titre}</div>
    <div class="results-card"><div class="results-score">${r.justes} / ${r.total}</div><div class="results-meta">${r.pct}% de mots justes · ${detail}</div></div>
    ${renderGain(state.dictee.gain, r.pct)}
    <div class="section-label">Ta copie corrigée</div>
    <div class="copie">${morceaux}</div>
    <div class="legende">
      <span><span class="pastille ok"></span> juste</span>
      <span><span class="pastille faute"></span> mal écrit</span>
      <span><span class="pastille oubli"></span> oublié</span>
      <span><span class="pastille ajout"></span> en trop</span>
    </div>
    <div class="section-label">Le texte original</div>
    <div class="cours-card">${d.texte}</div>
    <div class="btn-stack"><button class="btn btn-primary" data-action="refaire-dictee">🔄 Refaire cette dictée</button><button class="btn btn-secondary" data-action="back-to-dictees">← Autres dictées</button></div>
  </div>`;
}

function getDictee(id) { return DICTEES.find(d => d.id === id); }

function ouvrirDictee(id) {
  stopperVoix();
  state.dictee = { id, phrase: 0, vitesse: 0.75, saisi: '', resultat: null, gain: null, texteVisible: false };
  state.screen = 'dictee'; render();
}
function corrigerEtAfficher() {
  stopperVoix();
  const d = getDictee(state.dictee.id);
  const r = corrigerDictee(d.texte, state.dictee.saisi);
  state.dictee.resultat = r;
  saveBest('dictee-' + d.id, r.pct);
  state.dictee.gain = attribuerRecompense(r.pct);
  state.screen = 'dicteeResult'; render();
}

/* ================= Rendu ================= */
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'skillList') app.innerHTML = renderSkillList();
  else if (state.screen === 'mentalLesson') app.innerHTML = renderMentalLesson();
  else if (state.screen === 'skillLesson') app.innerHTML = renderSkillLesson();
  else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (state.screen === 'quizResults') app.innerHTML = renderQuizResults();
  else if (state.screen === 'dicteeList') app.innerHTML = renderDicteeList();
  else if (state.screen === 'dictee') app.innerHTML = renderDictee();
  else if (state.screen === 'dicteeResult') app.innerHTML = renderDicteeResult();
  attachListeners();
}
function attachListeners() {
  document.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', onAction));
  const saisie = document.getElementById('dictee-saisie');
  /* on garde la frappe dans l'état sans réafficher l'écran : un rendu à chaque
     lettre ferait perdre le curseur et le clavier du téléphone */
  if (saisie) saisie.addEventListener('input', (e) => { state.dictee.saisi = e.target.value; });
}

/* Le coffre à jetons, visible dès l'accueil : c'est ce qui donne envie de
   relancer un quiz. Les jetons et les hamsters sont communs aux trois niveaux. */
function renderRecompenses() {
  const jetons = getJetons(), hamsters = getHamsters();
  const cases = Array.from({ length: JETONS_PAR_HAMSTER }, (_, i) => `<span class="token${i < jetons ? '' : ' vide'}">🐱</span>`).join('');
  return `<div class="reward-strip">
    <div class="reward-head"><span class="reward-label">Mes jetons chatons</span><span class="reward-count">${jetons} / ${JETONS_PAR_HAMSTER}</span></div>
    <div class="token-row">${cases}</div>
    ${hamsters ? `<div class="reward-hamsters">🐹 ${hamsters} hamster${hamsters > 1 ? 's' : ''} gagné${hamsters > 1 ? 's' : ''} !</div>` : `<div class="reward-hamsters">Encore ${JETONS_PAR_HAMSTER - jetons} chaton${JETONS_PAR_HAMSTER - jetons > 1 ? 's' : ''} pour gagner un hamster 🐹</div>`}
  </div>`;
}

function renderHome() {
  const cards = [...(tricksForLevel(state.level).length ? [{ id: 'astuces', emoji: '🧠', title: 'Astuces calcul mental', desc: "Des exercices générés à l'infini" }] : []),
    /* la dictée est un exercice de français : elle n'a pas sa place dans un programme de maths singapourien */
    ...(dicteesPourNiveau(state.level).length ? [{ id: 'dictee', emoji: '✍️', title: 'Dictée', desc: `${dicteesPourNiveau(state.level).length} textes lus à voix haute` }] : []),
    ...domainesPourNiveau(state.level).map(({ d, n }) => ({ id: d.id, emoji: d.emoji, title: d.title, desc: `${n} compétence${n > 1 ? 's' : ''}` }))]
    .map(c => `<div class="mode-card" data-action="open-domain" data-id="${c.id}"><div class="mode-emoji">${c.emoji}</div><div class="mode-info"><div class="mode-title">${c.title}</div><div class="mode-desc">${c.desc}</div></div><div class="mode-arrow">→</div></div>`).join('');
  return `<div class="screen">
    <h1>🎓 Révise Malin</h1>
    <p class="subtitle">${state.level === 'singapour' ? 'Méthode de Singapour · Primary 6' : 'Programme complet CM2 &amp; 6ème'}</p>
    ${renderRecompenses()}
    <div class="level-switch">${LEVELS.map(l => `<button class="level-btn ${state.level === l.id ? 'active' : ''}" data-action="set-level" data-level="${l.id}">${l.label}</button>`).join('')}</div>
    ${cards}
  </div>`;
}

function renderSkillList() {
  if (state.currentDomain === 'astuces') {
    const list = tricksForLevel(state.level);
    const cards = list.map(t => { const best = getBest('mental-' + t.id + '-' + state.level); return `<div class="trick-card" data-action="open-mental" data-id="${t.id}"><div class="trick-emoji">${t.emoji}</div><div class="trick-info"><div class="trick-title">${t.title}</div>${best !== undefined ? `<div class="trick-progress">✓ Meilleur score : ${best}%</div>` : ''}</div><div class="mode-arrow">→</div></div>`; }).join('');
    return `<div class="screen"><button class="btn-back" data-action="go-home">← Retour</button><h1>🧠 Astuces calcul mental</h1><p class="subtitle">Niveau ${levelLabel(state.level)}</p>${cards}</div>`;
  }
  const d = getDomain(state.currentDomain);
  const list = skillsForLevel(state.currentDomain, state.level);
  const cards = list.map(s => { const best = getBest('skill-' + d.id + '-' + s.id + '-' + state.level); return `<div class="trick-card" data-action="open-skill" data-id="${s.id}"><div class="trick-emoji">${d.emoji}</div><div class="trick-info"><div class="trick-title">${s.title}</div>${best !== undefined ? `<div class="trick-progress">✓ Meilleur score : ${best}%</div>` : ''}</div><div class="mode-arrow">→</div></div>`; }).join('');
  return `<div class="screen"><button class="btn-back" data-action="go-home">← Retour</button><h1>${d.emoji} ${d.title}</h1><p class="subtitle">Niveau ${levelLabel(state.level)}</p>${cards || '<p class="subtitle">Aucune compétence pour ce niveau pour le moment.</p>'}</div>`;
}

function renderMentalLesson() {
  const t = getTrick(state.mentalTrickId);
  const [ex1, ex2] = pickDistinct(() => t.gen(state.level), (e) => e.formula, 2);
  return `<div class="screen"><button class="btn-back" data-action="back-to-list">← Retour</button>
    <div class="lesson-hero"><div class="lesson-emoji">${t.emoji}</div><div class="lesson-title">${t.title}</div><div class="lesson-explanation">${t.explanation}</div></div>
    <div class="section-label">Exemples</div>
    ${[ex1, ex2].map(ex => `<div class="step-card"><div class="step-formula">${ex.formula}</div><div class="step-breakdown">${ex.breakdown}</div><div class="step-result">= ${formatNum(ex.result)}</div></div>`).join('')}
    <div class="btn-stack" style="margin-top:0.5rem;"><button class="btn btn-secondary" data-action="regen">🔀 De nouveaux exemples</button><button class="btn btn-primary" data-action="start-mental-quiz">✨ Pratiquer (8 questions, chrono)</button></div>
  </div>`;
}

/* La leçon d'histoire ou de géographie : un texte à lire, des repères à
   retenir, puis le quiz. Pas d'exemples générés ici, il n'y a rien à tirer. */
function renderCours(s, d) {
  const reperes = s.reperes ? `<div class="reperes">${s.reperes.map(r => `<div class="repere"><span class="repere-cle">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>` : '';
  return `<div class="screen"><button class="btn-back" data-action="back-to-list">← Retour</button>
    <div class="lesson-hero"><div class="lesson-emoji">${d.emoji}</div><div class="lesson-title">${s.title}</div><div class="lesson-explanation">${s.explanation}</div></div>
    <div class="section-label">La leçon</div>
    <div class="cours-card">${s.cours.map(par => `<p>${par}</p>`).join('')}${reperes}</div>
    <div class="btn-stack" style="margin-top:0.5rem;"><button class="btn btn-primary" data-action="start-skill-quiz">✨ Pratiquer (8 questions, chrono)</button></div>
  </div>`;
}

function renderSkillLesson() {
  const s = getSkill(state.currentDomain, state.currentSkill); const d = getDomain(state.currentDomain);
  if (s.cours) return renderCours(s, d);
  const [ex1, ex2] = pickDistinct(() => s.question(state.level), lessonKey, 2);
  const exCard = (ex) => `<div class="step-card">${ex.formula ? `<div class="step-formula">${ex.formula}</div>` : `<div class="step-breakdown" style="margin-top:0;">${ex.prompt}</div>`}${ex.svg ? `<div class="step-shape">${ex.svg}</div>` : ''}<div class="step-result">Réponse : ${ex.answer}${ex.unit ? ' ' + ex.unit : ''}</div></div>`;
  return `<div class="screen"><button class="btn-back" data-action="back-to-list">← Retour</button>
    <div class="lesson-hero"><div class="lesson-emoji">${d.emoji}</div><div class="lesson-title">${s.title}</div><div class="lesson-explanation">${s.explanation}</div></div>
    <div class="section-label">Exemples</div>
    ${exCard(ex1)}${exCard(ex2)}
    <div class="btn-stack" style="margin-top:0.5rem;"><button class="btn btn-secondary" data-action="regen">🔀 De nouveaux exemples</button><button class="btn btn-primary" data-action="start-skill-quiz">✨ Pratiquer (8 questions, chrono)</button></div>
  </div>`;
}

function renderQuiz() {
  const qz = state.quiz; const cur = qz.questions[qz.index]; const total = qz.questions.length;
  const pctLeft = Math.max(0, Math.round((qz.timeLeft / cur.limit) * 100));
  const low = qz.timeLeft <= Math.ceil(cur.limit * 0.3);
  const optionsHtml = cur.options.map(opt => { let cls = 'option-btn'; if (qz.answered) { if (opt === cur.answer) cls += ' correct'; else if (opt === qz.lastChosen) cls += ' wrong'; } return `<button class="${cls}" data-action="answer-quiz" data-value="${opt}" ${qz.answered || qz.pause ? 'disabled' : ''}>${opt}</button>`; }).join('');
  const carteQuestion = qz.pause
    ? `<div class="pause-panel"><div class="pause-emoji">⏸️</div><div class="pause-title">Pause</div><div class="pause-note">Le chrono est arrêté. La question réapparaîtra quand tu reprendras.</div></div>`
    : `<div class="question-card">
      ${cur.formula ? `<div class="question-label">${cur.prompt}</div><div class="question-formula">${cur.formula}</div>` : `<div class="question-label">${cur.prompt}</div>${cur.svg ? `<div class="question-shape">${cur.svg}</div>` : ''}${cur.unit ? `<div style="font-size:0.78rem;color:var(--text-secondary);">Réponse en ${cur.unit}</div>` : ''}`}
    </div>`;
  return `<div class="screen">
    <div class="quiz-topbar"><div class="quiz-progress">${cur.category} · ${qz.index + 1}/${total}</div><button class="btn-pause" data-action="toggle-pause">${qz.pause ? '▶ Reprendre' : '⏸ Pause'}</button><div class="quiz-score">⭐ ${qz.score}</div></div>
    <div class="timer-wrap"><div class="timer-bar-bg"><div class="timer-bar-fill ${low ? 'low' : ''}" style="width:${pctLeft}%"></div></div><div class="timer-num">${Math.max(0, qz.timeLeft)} s</div></div>
    ${carteQuestion}
    <div class="options-grid">${optionsHtml}</div>
  </div>`;
}

/* Ce qui vient d'être gagné, annoncé juste sous le score. `gain` est calculé
   une seule fois en fin de quiz, jamais au moment du rendu. */
function renderGain(gain, pct) {
  if (!gain) return '';
  if (gain.hamster) return `<div class="hamster-card"><div class="hamster-emoji">🐹</div><div class="hamster-title">Tu as gagné un hamster !</div><div class="hamster-note">${JETONS_PAR_HAMSTER} jetons chatons échangés. Tu en as maintenant ${gain.hamsters} au total.</div></div>`;
  if (gain.jeton) return `<div class="gain-card"><div class="gain-emoji">🐱</div><div class="gain-text">+1 jeton chaton !</div><div class="gain-sub">${gain.jetons} / ${JETONS_PAR_HAMSTER} — encore ${JETONS_PAR_HAMSTER - gain.jetons} pour un hamster 🐹</div></div>`;
  /* « presque » n'a de sens que si le score en est vraiment proche */
  const encouragement = pct >= SEUIL_JETON - 20 ? `Tu y es presque : ${pct} % cette fois.` : `Tu as obtenu ${pct} %. Relis la leçon, puis retente ta chance !`;
  return `<div class="gain-card" style="background:var(--warning-bg);border-color:#E8C98A;"><div class="gain-text" style="color:#8A5510;">Il faut ${SEUIL_JETON} % pour gagner un jeton chaton 🐱</div><div class="gain-sub">${encouragement}</div></div>`;
}

function renderQuizResults() {
  const qz = state.quiz; const total = qz.questions.length;
  const pct = Math.round((qz.score / total) * 100);
  const avgTime = Math.round((qz.times.reduce((a, b) => a + b, 0) / total) * 10) / 10;
  const emoji = pct === 100 ? '🏆' : pct >= 80 ? '🌟' : pct >= 50 ? '👍' : '💪';
  const title = pct === 100 ? 'Parfait !' : pct >= 80 ? 'Excellent !' : pct >= 50 ? 'Bien joué !' : "Continue à t'entraîner";
  let verdictClass = 'verdict-good', verdictText = "Compétence maîtrisée ! Essaie-en une autre ou monte de niveau.";
  if (pct < 50) { verdictClass = 'verdict-low'; verdictText = "Cette notion mérite d'être revue calmement. Relis la leçon puis réessaie."; }
  else if (pct < 80) { verdictClass = 'verdict-mid'; verdictText = 'Bonne base ! Encore un peu de pratique pour bien maîtriser.'; }
  const cats = Object.keys(qz.catStats);
  const breakdownHtml = cats.length > 1 ? `<div class="breakdown-list">${cats.map(c => `<div class="breakdown-row"><span>${c}</span><span>${qz.catStats[c].correct}/${qz.catStats[c].total}</span></div>`).join('')}</div>` : '';
  return `<div class="screen">
    <div class="results-emoji">${emoji}</div><div class="results-title">${title}</div>
    <div class="results-card"><div class="results-score">${qz.score} / ${total}</div><div class="results-meta">${pct}% de réussite · ${avgTime}s en moyenne par question</div></div>
    ${breakdownHtml}
    ${renderGain(qz.gain, pct)}
    <div class="verdict-box ${verdictClass}">${verdictText}</div>
    <div class="btn-stack"><button class="btn btn-primary" data-action="retry-quiz">🔄 Rejouer</button><button class="btn btn-secondary" data-action="go-home">← Retour à l'accueil</button></div>
  </div>`;
}

/* ================= Actions ================= */
function onAction(e) {
  const a = e.currentTarget.dataset.action;
  if (a === 'set-level') setLevel(e.currentTarget.dataset.level);
  else if (a === 'go-home') { clearTimer(); stopperVoix(); state.screen = 'home'; state.quiz = null; render(); }
  else if (a === 'open-domain') {
    const id = e.currentTarget.dataset.id;
    if (id === 'dictee') { state.screen = 'dicteeList'; render(); return; }
    state.currentDomain = id; state.screen = 'skillList'; render();
  }
  else if (a === 'open-dictee') ouvrirDictee(e.currentTarget.dataset.id);
  else if (a === 'back-to-dictees') { stopperVoix(); state.screen = 'dicteeList'; render(); }
  else if (a === 'dire-phrase') direTexte(phrasesDe(getDictee(state.dictee.id).texte)[state.dictee.phrase], state.dictee.vitesse);
  else if (a === 'dire-tout') direTexte(getDictee(state.dictee.id).texte, state.dictee.vitesse);
  else if (a === 'phrase-suivante') { stopperVoix(); state.dictee.phrase++; render(); }
  else if (a === 'phrase-precedente') { stopperVoix(); state.dictee.phrase--; render(); }
  else if (a === 'vitesse-lente') { state.dictee.vitesse = 0.75; render(); }
  else if (a === 'vitesse-normale') { state.dictee.vitesse = 0.95; render(); }
  else if (a === 'afficher-texte') { state.dictee.texteVisible = true; render(); }
  else if (a === 'cacher-texte') { state.dictee.texteVisible = false; render(); }
  else if (a === 'corriger-dictee') corrigerEtAfficher();
  else if (a === 'refaire-dictee') ouvrirDictee(state.dictee.id);
  else if (a === 'back-to-list') { state.screen = 'skillList'; render(); }
  else if (a === 'open-mental') { state.mentalTrickId = e.currentTarget.dataset.id; state.screen = 'mentalLesson'; render(); }
  else if (a === 'open-skill') { state.currentSkill = e.currentTarget.dataset.id; state.screen = 'skillLesson'; render(); }
  else if (a === 'regen') { render(); }
  else if (a === 'start-mental-quiz') { const id = state.mentalTrickId; startQuiz('mental', () => buildMentalQuiz(id, 8), 'mental-' + id + '-' + state.level); }
  else if (a === 'start-skill-quiz') { const dId = state.currentDomain, sId = state.currentSkill; startQuiz('skill', () => buildSkillQuiz(dId, sId, 8), 'skill-' + dId + '-' + sId + '-' + state.level); }
  else if (a === 'answer-quiz') { state.quiz.lastChosen = e.currentTarget.dataset.value; answerQuiz(e.currentTarget.dataset.value); }
  else if (a === 'retry-quiz') { startQuiz(state.quiz.kind, state.quiz.rebuild, state.quiz.bestKey); }
  else if (a === 'toggle-pause') { state.quiz.pause = !state.quiz.pause; render(); }
}

render();

/* ================= PWA install ================= */
let deferredPrompt;

/* Déjà installée : l'app se lance alors dans sa propre fenêtre, sans barre
   d'adresse. Inutile de proposer de l'installer une seconde fois. */
function isInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

/* La bande revient au bout d'une semaine si elle a été fermée sans installer. */
const INSTALL_SNOOZE = 7 * 24 * 3600 * 1000;
function installSnoozed() { const s = loadStore(); return s.installHiddenAt && Date.now() - s.installHiddenAt < INSTALL_SNOOZE; }
function snoozeInstall() { const s = loadStore(); s.installHiddenAt = Date.now(); saveStore(s); }

/* Chrome sur Android laisse déclencher l'installation depuis la page. */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; showInstallBanner(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; hideInstallBanner(); });

/* Ailleurs (iPhone, Firefox, Chrome qui ne propose rien) l'événement ci-dessus
   n'arrive jamais : on affiche alors la marche à suivre du navigateur. */
window.addEventListener('load', () => { setTimeout(() => { if (!deferredPrompt) showInstallBanner(); }, 3000); });

function showInstallBanner() {
  if (document.getElementById('install-banner') || isInstalled() || installSnoozed()) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const banner = document.createElement('div'); banner.id = 'install-banner'; banner.className = 'install-banner';
  const help = isIOS ? "Appuie sur Partager puis « Sur l'écran d'accueil »" : "Ouvre le menu ⋮ puis « Installer l'application »";
  banner.innerHTML = `<div class="install-text">📲 Installe l'appli sur ton téléphone !${deferredPrompt ? '' : `<span class="install-help">${help}</span>`}</div>${deferredPrompt ? '<button class="install-btn">Installer</button>' : ''}<button class="dismiss-btn">✕</button>`;
  document.body.appendChild(banner);
  /* la bande est fixée en bas de l'écran : on réserve sa hauteur dans #app,
     sinon elle recouvrirait la dernière carte et le bouton « Pratiquer ». */
  document.documentElement.style.setProperty('--install-offset', banner.offsetHeight + 'px');
  const installBtn = banner.querySelector('.install-btn');
  if (installBtn) installBtn.addEventListener('click', async () => { hideInstallBanner(); if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; } });
  banner.querySelector('.dismiss-btn').addEventListener('click', () => { hideInstallBanner(); snoozeInstall(); });
}

function hideInstallBanner() {
  const banner = document.getElementById('install-banner');
  if (banner) banner.remove();
  document.documentElement.style.removeProperty('--install-offset');
}
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
