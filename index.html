  /* ========== Sciences et technologie ========== */
  { id: 'sciences', emoji: '🔬', title: 'Sciences et technologie', skills: [
    { id: 'sci-matiere', title: 'La matière et ses états', explanation: "Solide, liquide, gaz : reconnaître les états de la matière et les changements qui font passer de l'un à l'autre.", levels: ['cm2', 'sixieme'],
      cours: [
        "La matière existe sous trois <strong>états</strong> : <strong>solide</strong> (il a sa forme propre), <strong>liquide</strong> (il prend la forme du récipient et sa surface est plane) et <strong>gazeux</strong> (il occupe tout l'espace disponible).",
        "L'eau change d'état selon la température. À <strong>0 °C</strong> elle gèle : c'est la <strong>solidification</strong>. La glace qui redevient liquide, c'est la <strong>fusion</strong>. À <strong>100 °C</strong> l'eau bout et devient vapeur : c'est la <strong>vaporisation</strong>. La vapeur qui redevient liquide, c'est la <strong>condensation</strong>.",
        "Lors d'un changement d'état, la <strong>masse ne change pas</strong> : un litre d'eau congelé pèse toujours autant. Le <strong>volume</strong>, lui, peut changer — l'eau prend plus de place en gelant, c'est pourquoi une bouteille pleine éclate au congélateur.",
        "Un <strong>mélange</strong> peut être <strong>homogène</strong> (on ne distingue pas les constituants, comme l'eau salée) ou <strong>hétérogène</strong> (on les distingue, comme l'eau et le sable). Pour séparer, on utilise la <strong>décantation</strong>, la <strong>filtration</strong> ou l'<strong>évaporation</strong>."
      ],
      reperes: [['0 °C', "L'eau gèle"], ['100 °C', "L'eau bout"], ['Fusion', 'Solide vers liquide'], ['Homogène', 'On ne distingue pas les constituants']],
      question() { return questionDeBanque([
        { cat: 'Matière', prompt: "Combien y a-t-il d'états de la matière ?", answer: 'Trois', faux: ['Deux', 'Quatre', 'Cinq'], expl: "Solide, liquide et gazeux : trois états pour une même matière." },
        { cat: 'Matière', prompt: "À quelle température l'eau gèle-t-elle ?", answer: '0 °C', faux: ['100 °C', '10 °C', '-100 °C'], expl: "À 0 °C l'eau passe de l'état liquide à l'état solide : c'est la solidification." },
        { cat: 'Matière', prompt: "À quelle température l'eau bout-elle ?", answer: '100 °C', faux: ['0 °C', '50 °C', '200 °C'], expl: "À 100 °C au niveau de la mer, l'eau passe à l'état de vapeur." },
        { cat: 'Matière', prompt: "Comment appelle-t-on le passage de solide à liquide ?", answer: 'La fusion', faux: ['La solidification', "L'évaporation", 'La condensation'], expl: "La fusion : la glace fond et redevient eau liquide." },
        { cat: 'Matière', prompt: "Que devient la masse de l'eau quand elle gèle ?", answer: 'Elle ne change pas', faux: ['Elle augmente', 'Elle diminue', 'Elle double'], expl: "La masse se conserve toujours lors d'un changement d'état ; seul le volume change." },
        { cat: 'Matière', prompt: "Pourquoi une bouteille pleine éclate-t-elle au congélateur ?", answer: "L'eau prend plus de place en gelant", faux: ['Le verre rétrécit', "L'eau devient plus lourde", 'Le froid dilate le plastique'], expl: "En gelant, l'eau augmente de volume et pousse sur les parois jusqu'à les briser." },
        { cat: 'Matière', prompt: "L'eau salée est un mélange...", answer: 'Homogène', faux: ['Hétérogène', 'Solide', 'Gazeux'], expl: "Homogène : une fois dissous, le sel ne se distingue plus à l'œil." },
        { cat: 'Matière', prompt: "Quelle technique sépare le sable de l'eau ?", answer: 'La filtration', faux: ['La fusion', 'La vaporisation', 'La condensation'], expl: "La filtration : le filtre retient le sable et laisse passer l'eau." },
        { cat: 'Matière', prompt: "Comment récupérer le sel d'une eau salée ?", answer: 'Par évaporation', faux: ['Par filtration', 'Par congélation', 'Par décantation'], expl: "En laissant l'eau s'évaporer : le sel reste au fond, c'est le principe des marais salants." },
        { cat: 'Matière', prompt: "Quelle est la particularité d'un gaz ?", answer: "Il occupe tout l'espace disponible", faux: ['Il a sa forme propre', 'Sa surface est plane', 'Il ne pèse rien'], expl: "Un gaz n'a ni forme ni volume propres : il occupe tout l'espace qu'on lui donne." },
        { cat: 'Matière', prompt: "La buée sur une vitre froide est due à...", answer: 'La condensation', faux: ['La fusion', 'La solidification', 'La filtration'], expl: "La vapeur d'eau de l'air se refroidit au contact de la vitre et redevient liquide." }
      ]); } },

    { id: 'sci-energie', title: "L'énergie et ses formes", explanation: "D'où vient l'énergie que nous utilisons, et comment elle se transforme.", levels: ['cm2', 'sixieme'],
      cours: [
        "L'<strong>énergie</strong> est ce qui permet d'agir : chauffer, éclairer, mettre en mouvement. Elle existe sous plusieurs formes — <strong>lumineuse</strong>, <strong>thermique</strong> (chaleur), <strong>électrique</strong>, <strong>mécanique</strong> (mouvement), <strong>chimique</strong> (dans les aliments et les carburants).",
        "On distingue les sources <strong>renouvelables</strong>, qui se reconstituent sans cesse — <strong>soleil</strong>, <strong>vent</strong>, <strong>eau</strong>, <strong>biomasse</strong>, <strong>géothermie</strong> — et les sources <strong>non renouvelables</strong>, en quantité limitée : <strong>charbon</strong>, <strong>pétrole</strong>, <strong>gaz</strong>, <strong>uranium</strong>.",
        "L'énergie ne se crée pas et ne disparaît pas : elle se <strong>transforme</strong>. Une lampe transforme l'énergie électrique en lumière et en chaleur ; une éolienne transforme le mouvement du vent en électricité.",
        "Un <strong>circuit électrique</strong> simple a besoin d'un <strong>générateur</strong> (la pile), de <strong>fils conducteurs</strong> et d'un <strong>récepteur</strong> (la lampe). Le circuit doit être <strong>fermé</strong> pour que le courant circule. Les métaux sont <strong>conducteurs</strong> ; le plastique, le bois et le verre sont <strong>isolants</strong>."
      ],
      reperes: [['Renouvelable', 'Soleil, vent, eau, biomasse, géothermie'], ['Non renouvelable', 'Charbon, pétrole, gaz, uranium'], ['Circuit fermé', 'Condition pour que le courant passe'], ['Conducteur', 'Les métaux laissent passer le courant']],
      question() { return questionDeBanque([
        { cat: 'Énergie', prompt: "Laquelle de ces sources d'énergie est renouvelable ?", answer: 'Le vent', faux: ['Le charbon', 'Le pétrole', "L'uranium"], expl: "Le vent se renouvelle en permanence, contrairement au charbon ou au pétrole." },
        { cat: 'Énergie', prompt: "Laquelle de ces sources d'énergie n'est pas renouvelable ?", answer: 'Le pétrole', faux: ['Le soleil', "L'eau", 'Le vent'], expl: "Le pétrole s'est formé en millions d'années : les réserves sont limitées." },
        { cat: 'Énergie', prompt: "Que fait l'énergie : elle se crée ou elle se transforme ?", answer: 'Elle se transforme', faux: ['Elle se crée', 'Elle disparaît', 'Elle se multiplie'], expl: "L'énergie ne se crée ni ne disparaît : elle change seulement de forme." },
        { cat: 'Énergie', prompt: "Que transforme une éolienne ?", answer: "Le mouvement du vent en électricité", faux: ['La lumière en chaleur', "L'eau en vapeur", 'Le charbon en gaz'], expl: "Les pales captent l'énergie du vent et la génératrice la transforme en électricité." },
        { cat: 'Énergie', prompt: "De quoi a besoin un circuit électrique simple ?", answer: "D'un générateur, de fils et d'un récepteur", faux: ["D'un aimant seulement", "D'eau et de sel", "D'un miroir"], expl: "Un générateur pour fournir le courant, des fils pour le conduire, un récepteur pour l'utiliser." },
        { cat: 'Énergie', prompt: "Pour que le courant circule, le circuit doit être...", answer: 'Fermé', faux: ['Ouvert', 'Coupé', 'Mouillé'], expl: "Fermé : si le circuit est ouvert quelque part, le courant ne peut pas circuler." },
        { cat: 'Énergie', prompt: "Lequel de ces matériaux est isolant ?", answer: 'Le plastique', faux: ['Le cuivre', 'Le fer', "L'aluminium"], expl: "Le plastique ne laisse pas passer le courant : c'est pourquoi il gaine les fils." },
        { cat: 'Énergie', prompt: "Lequel de ces matériaux conduit le courant ?", answer: 'Le cuivre', faux: ['Le bois', 'Le verre', 'Le plastique'], expl: "Le cuivre est un métal : les métaux conduisent bien l'électricité." },
        { cat: 'Énergie', prompt: "Quelle énergie contiennent les aliments ?", answer: "De l'énergie chimique", faux: ["De l'énergie électrique", "De l'énergie lumineuse", "De l'énergie nucléaire"], expl: "De l'énergie chimique, que le corps libère lors de la digestion." },
        { cat: 'Énergie', prompt: "Une lampe allumée produit de la lumière et...", answer: 'De la chaleur', faux: ['Du son', 'Du vent', "De l'eau"], expl: "Une partie de l'électricité se transforme en chaleur : c'est pourquoi une lampe chauffe." },
        { cat: 'Énergie', prompt: "D'où vient la quasi-totalité de l'énergie sur Terre à l'origine ?", answer: 'Du Soleil', faux: ['De la Lune', 'Du centre de la Terre', 'Des océans'], expl: "Le Soleil : il est à l'origine du vent, de la pluie, des plantes et donc des énergies fossiles." }
      ]); } },

    { id: 'sci-corps', title: 'Le corps humain', explanation: "Digestion, respiration, circulation : comment le corps se nourrit et fonctionne.", levels: ['cm2', 'sixieme'],
      cours: [
        "La <strong>digestion</strong> transforme les aliments en nutriments assimilables. Le trajet suit le <strong>tube digestif</strong> : bouche, œsophage, <strong>estomac</strong>, <strong>intestin grêle</strong>, gros intestin. C'est dans l'<strong>intestin grêle</strong> que les nutriments passent dans le sang.",
        "La <strong>respiration</strong> apporte le <strong>dioxygène</strong> de l'air. Il entre par le nez et la bouche, descend par la trachée jusqu'aux <strong>poumons</strong>. Le sang y prend le dioxygène et y rejette le <strong>dioxyde de carbone</strong>.",
        "La <strong>circulation</strong> distribue tout cela. Le <strong>cœur</strong> est un muscle qui pompe le sang en permanence. Les <strong>artères</strong> partent du cœur, les <strong>veines</strong> y ramènent le sang.",
        "Pour rester en bonne santé, il faut une alimentation <strong>variée et équilibrée</strong>, une <strong>activité physique</strong> régulière et un <strong>sommeil</strong> suffisant — un enfant de cet âge a besoin d'environ <strong>9 à 11 heures</strong> de sommeil par nuit."
      ],
      reperes: [['Intestin grêle', 'Le passage des nutriments dans le sang'], ['Poumons', 'Échange dioxygène / dioxyde de carbone'], ['Cœur', 'Le muscle qui pompe le sang'], ['Artères', 'Elles partent du cœur']],
      question() { return questionDeBanque([
        { cat: 'Corps humain', prompt: "Dans quel organe les nutriments passent-ils dans le sang ?", answer: "L'intestin grêle", faux: ["L'estomac", 'Le foie', 'Le poumon'], expl: "Dans l'intestin grêle, dont la paroi très repliée laisse passer les nutriments vers le sang." },
        { cat: 'Corps humain', prompt: "Quel gaz le corps prend-il dans l'air ?", answer: 'Le dioxygène', faux: ['Le dioxyde de carbone', "L'azote", "L'hydrogène"], expl: "Le dioxygène, indispensable au fonctionnement de toutes les cellules." },
        { cat: 'Corps humain', prompt: "Quel gaz le corps rejette-t-il en respirant ?", answer: 'Le dioxyde de carbone', faux: ['Le dioxygène', "L'azote", 'La vapeur seule'], expl: "Le dioxyde de carbone, déchet produit par les cellules." },
        { cat: 'Corps humain', prompt: "Quel organe pompe le sang dans tout le corps ?", answer: 'Le cœur', faux: ['Le poumon', "L'estomac", 'Le cerveau'], expl: "Le cœur, un muscle qui bat environ 100 000 fois par jour." },
        { cat: 'Corps humain', prompt: "Les artères transportent le sang...", answer: 'En partant du cœur', faux: ['Vers le cœur', 'Vers l\'estomac seulement', 'Dans les deux sens'], expl: "Les artères partent du cœur ; les veines y ramènent le sang." },
        { cat: 'Corps humain', prompt: "Par quoi commence le tube digestif ?", answer: 'La bouche', faux: ["L'estomac", "L'intestin", "L'œsophage"], expl: "Par la bouche, où les dents broient et la salive commence à transformer les aliments." },
        { cat: 'Corps humain', prompt: "De combien d'heures de sommeil un enfant de 11 ans a-t-il besoin ?", answer: 'Environ 9 à 11 heures', faux: ['Environ 4 heures', 'Environ 6 heures', 'Environ 14 heures'], expl: "Entre 9 et 11 heures : le sommeil sert à grandir et à mémoriser." },
        { cat: 'Corps humain', prompt: "Où arrive l'air après la trachée ?", answer: 'Dans les poumons', faux: ["Dans l'estomac", 'Dans le cœur', 'Dans le foie'], expl: "Dans les poumons, où il atteint les alvéoles et passe dans le sang." },
        { cat: 'Corps humain', prompt: "Qu'est-ce qu'une alimentation équilibrée ?", answer: 'Variée, avec des aliments de chaque groupe', faux: ['Uniquement des légumes', 'Uniquement des protéines', 'Sans jamais de féculents'], expl: "Manger de tout en bonne proportion, sans supprimer ni abuser d'aucun groupe d'aliments." },
        { cat: 'Corps humain', prompt: "Que fait la digestion aux aliments ?", answer: 'Elle les transforme en nutriments', faux: ['Elle les fait disparaître', 'Elle les refroidit', 'Elle les transforme en air'], expl: "Elle les découpe en nutriments assez petits pour passer dans le sang." }
      ]); } },

    { id: 'sci-vivant', title: 'Le monde vivant', explanation: "Classer les êtres vivants et comprendre ce dont ils ont besoin pour vivre.", levels: ['cm2', 'sixieme'],
      cours: [
        "Un <strong>être vivant</strong> naît, se nourrit, grandit, se reproduit et meurt. On classe les êtres vivants d'après ce qu'ils <strong>possèdent en commun</strong>, et non d'après ce qui leur manque.",
        "Les <strong>vertébrés</strong> ont une colonne vertébrale. On y trouve cinq groupes : <strong>mammifères</strong>, <strong>oiseaux</strong>, <strong>reptiles</strong>, <strong>amphibiens</strong> et <strong>poissons</strong>. Les autres animaux sont des <strong>invertébrés</strong> : insectes, araignées, mollusques, vers.",
        "Les <strong>végétaux verts</strong> fabriquent eux-mêmes leur matière organique à partir d'eau, de <strong>dioxyde de carbone</strong> et de <strong>lumière</strong> : c'est la <strong>photosynthèse</strong>. On les appelle des <strong>producteurs</strong>.",
        "Dans une <strong>chaîne alimentaire</strong>, chaque être vivant mange le précédent. Elle commence toujours par un <strong>végétal</strong>. Un animal qui ne mange que des végétaux est <strong>herbivore</strong>, celui qui ne mange que des animaux est <strong>carnivore</strong>, celui qui mange les deux est <strong>omnivore</strong>."
      ],
      reperes: [['Vertébrés', 'Mammifères, oiseaux, reptiles, amphibiens, poissons'], ['Photosynthèse', 'Les végétaux produisent grâce à la lumière'], ['Chaîne alimentaire', 'Elle commence par un végétal'], ['Omnivore', 'Il mange végétaux et animaux']],
      question() { return questionDeBanque([
        { cat: 'Le vivant', prompt: "Combien de groupes de vertébrés distingue-t-on ?", answer: 'Cinq', faux: ['Trois', 'Sept', 'Dix'], expl: "Mammifères, oiseaux, reptiles, amphibiens et poissons : cinq groupes." },
        { cat: 'Le vivant', prompt: "Lequel de ces animaux est un invertébré ?", answer: "L'araignée", faux: ['Le chat', 'La grenouille', 'Le saumon'], expl: "L'araignée n'a pas de colonne vertébrale : c'est un invertébré, comme les insectes." },
        { cat: 'Le vivant', prompt: "Comment appelle-t-on la fabrication de matière par les végétaux verts ?", answer: 'La photosynthèse', faux: ['La digestion', 'La respiration', 'La germination'], expl: "La photosynthèse, qui se déroule dans les feuilles grâce à la chlorophylle." },
        { cat: 'Le vivant', prompt: "De quoi les végétaux verts ont-ils besoin pour la photosynthèse ?", answer: "D'eau, de dioxyde de carbone et de lumière", faux: ["De viande et d'eau", "De dioxygène seulement", "De terre uniquement"], expl: "De l'eau puisée par les racines, du dioxyde de carbone de l'air et de la lumière du Soleil." },
        { cat: 'Le vivant', prompt: "Par quoi commence toujours une chaîne alimentaire ?", answer: 'Un végétal', faux: ['Un carnivore', 'Un omnivore', 'Un champignon'], expl: "Par un végétal : lui seul produit sa propre matière, les autres la consomment." },
        { cat: 'Le vivant', prompt: "Comment appelle-t-on un animal qui ne mange que des végétaux ?", answer: 'Un herbivore', faux: ['Un carnivore', 'Un omnivore', 'Un producteur'], expl: "Un herbivore, comme la vache ou le lapin." },
        { cat: 'Le vivant', prompt: "La grenouille appartient au groupe des...", answer: 'Amphibiens', faux: ['Reptiles', 'Poissons', 'Mammifères'], expl: "Les amphibiens vivent d'abord dans l'eau, puis respirent l'air à l'âge adulte." },
        { cat: 'Le vivant', prompt: "Sur quoi la classification du vivant se fonde-t-elle ?", answer: 'Sur ce que les êtres vivants ont en commun', faux: ['Sur leur taille', 'Sur ce qui leur manque', 'Sur leur couleur'], expl: "On regroupe selon ce que les êtres vivants possèdent en commun, jamais selon ce qui leur manque." },
        { cat: 'Le vivant', prompt: "Qu'est-ce qui caractérise un vertébré ?", answer: 'Il a une colonne vertébrale', faux: ['Il a des poils', 'Il pond des œufs', 'Il vit dans l\'eau'], expl: "La présence d'une colonne vertébrale, faite de vertèbres." },
        { cat: 'Le vivant', prompt: "La baleine appartient au groupe des...", answer: 'Mammifères', faux: ['Poissons', 'Reptiles', 'Amphibiens'], expl: "Elle allaite ses petits et respire de l'air : c'est un mammifère, malgré sa vie marine." }
      ]); } },

    { id: 'sci-terre', title: 'La Terre et le ciel', explanation: "Le système solaire, les saisons et les mouvements de notre planète.", levels: ['cm2', 'sixieme'],
      cours: [
        "Le <strong>système solaire</strong> compte <strong>huit planètes</strong> qui tournent autour du <strong>Soleil</strong>, une étoile. Dans l'ordre : Mercure, Vénus, <strong>la Terre</strong>, Mars, Jupiter, Saturne, Uranus, Neptune. La Terre est la <strong>troisième</strong>.",
        "La Terre tourne sur elle-même en <strong>24 heures</strong> : c'est la <strong>rotation</strong>, qui explique l'alternance du <strong>jour et de la nuit</strong>. Elle tourne aussi autour du Soleil en <strong>365 jours et un quart</strong> : c'est la <strong>révolution</strong>, qui donne l'année.",
        "L'<strong>axe de la Terre est incliné</strong>. C'est cette inclinaison, et non la distance au Soleil, qui explique les <strong>saisons</strong> : selon le moment de l'année, un hémisphère reçoit les rayons plus directement que l'autre.",
        "La <strong>Lune</strong> est le <strong>satellite</strong> naturel de la Terre : elle tourne autour d'elle. Elle ne produit pas de lumière, elle <strong>réfléchit</strong> celle du Soleil. C'est pourquoi on la voit changer de forme au fil du mois."
      ],
      reperes: [['8', 'Nombre de planètes du système solaire'], ['24 h', 'Rotation de la Terre : le jour et la nuit'], ['365 jours ¼', "Révolution autour du Soleil : l'année"], ['Inclinaison', "La cause des saisons"]],
      question() { return questionDeBanque([
        { cat: 'La Terre', prompt: "Combien de planètes compte le système solaire ?", answer: 'Huit', faux: ['Neuf', 'Sept', 'Douze'], expl: "Huit depuis 2006, date à laquelle Pluton a été reclassée en planète naine." },
        { cat: 'La Terre', prompt: "Quelle est la position de la Terre par rapport au Soleil ?", answer: 'La troisième planète', faux: ['La première', 'La deuxième', 'La cinquième'], expl: "Troisième, après Mercure et Vénus. Cette distance rend l'eau liquide possible." },
        { cat: 'La Terre', prompt: "En combien de temps la Terre tourne-t-elle sur elle-même ?", answer: '24 heures', faux: ['365 jours', 'Un mois', '12 heures'], expl: "En 24 heures, ce qui définit la durée du jour." },
        { cat: 'La Terre', prompt: "Qu'est-ce qui explique l'alternance du jour et de la nuit ?", answer: 'La rotation de la Terre', faux: ['La révolution autour du Soleil', 'Les phases de la Lune', "L'inclinaison de l'axe"], expl: "La rotation : la face éclairée par le Soleil change au fil des heures." },
        { cat: 'La Terre', prompt: "Qu'est-ce qui explique les saisons ?", answer: "L'inclinaison de l'axe de la Terre", faux: ['La distance au Soleil', 'La rotation en 24 h', 'La Lune'], expl: "L'axe incliné fait que chaque hémisphère reçoit les rayons plus ou moins directement selon la saison." },
        { cat: 'La Terre', prompt: "Le Soleil est...", answer: 'Une étoile', faux: ['Une planète', 'Un satellite', 'Une comète'], expl: "Une étoile : il produit sa propre lumière, contrairement aux planètes." },
        { cat: 'La Terre', prompt: "La Lune est le satellite de quelle planète ?", answer: 'La Terre', faux: ['Mars', 'Vénus', 'Jupiter'], expl: "La Terre : la Lune en fait le tour en environ 27 jours." },
        { cat: 'La Terre', prompt: "Pourquoi voit-on la Lune briller ?", answer: 'Elle réfléchit la lumière du Soleil', faux: ['Elle produit sa propre lumière', 'Elle est en feu', 'Elle réfléchit la lumière de la Terre'], expl: "Elle n'émet pas de lumière : on voit la lumière du Soleil qu'elle renvoie." },
        { cat: 'La Terre', prompt: "En combien de temps la Terre fait-elle le tour du Soleil ?", answer: 'Environ 365 jours', faux: ['24 heures', '30 jours', '10 ans'], expl: "Environ 365 jours et un quart, d'où l'année bissextile tous les quatre ans." },
        { cat: 'La Terre', prompt: "Quelle planète suit la Terre en s'éloignant du Soleil ?", answer: 'Mars', faux: ['Vénus', 'Mercure', 'Jupiter'], expl: "Mars, la quatrième planète, surnommée la planète rouge." }
      ]); } },

    { id: 'sci-objets', title: 'Objets techniques et matériaux', explanation: "À quoi sert un objet, en quoi il est fait, et comment il fonctionne.", levels: ['cm2', 'sixieme'],
      cours: [
        "Un <strong>objet technique</strong> est fabriqué par l'humain pour répondre à un <strong>besoin</strong>. Sa <strong>fonction d'usage</strong> est ce à quoi il sert : la fonction d'usage d'un vélo est de se déplacer.",
        "Chaque objet est fait de <strong>matériaux</strong> choisis pour leurs propriétés : le <strong>métal</strong> est résistant, le <strong>plastique</strong> est léger et isolant, le <strong>bois</strong> est solide et renouvelable, le <strong>verre</strong> est transparent mais fragile.",
        "Un objet se décompose en <strong>éléments</strong> qui remplissent chacun une <strong>fonction technique</strong> : sur un vélo, les freins servent à ralentir, la chaîne à transmettre le mouvement, le guidon à diriger.",
        "Fabriquer un objet consomme des <strong>ressources</strong> et de l'<strong>énergie</strong>. Pour limiter cet impact, on peut <strong>réparer</strong>, <strong>réutiliser</strong> et <strong>recycler</strong> plutôt que jeter."
      ],
      reperes: [['Fonction d\'usage', "Ce à quoi l'objet sert"], ['Fonction technique', 'Le rôle de chaque élément'], ['Matériau', 'Choisi pour ses propriétés'], ['Réparer, réutiliser, recycler', "Limiter l'impact"]],
      question() { return questionDeBanque([
        { cat: 'Objets techniques', prompt: "Qu'est-ce que la fonction d'usage d'un objet ?", answer: "Ce à quoi il sert", faux: ['Sa couleur', 'Son prix', 'Son poids'], expl: "C'est le besoin auquel il répond, autrement dit ce à quoi il sert." },
        { cat: 'Objets techniques', prompt: "Quelle est la fonction d'usage d'un vélo ?", answer: 'Se déplacer', faux: ['Faire du bruit', 'Éclairer', 'Mesurer le temps'], expl: "Se déplacer : c'est le besoin auquel le vélo répond." },
        { cat: 'Objets techniques', prompt: "Quel matériau est transparent mais fragile ?", answer: 'Le verre', faux: ['Le métal', 'Le bois', 'Le plastique'], expl: "Le verre laisse passer la lumière mais casse net sous un choc." },
        { cat: 'Objets techniques', prompt: "Quel matériau est léger et isolant ?", answer: 'Le plastique', faux: ['Le fer', 'Le cuivre', "L'acier"], expl: "Le plastique : léger, isolant et façonnable, d'où son usage massif." },
        { cat: 'Objets techniques', prompt: "Sur un vélo, à quoi sert la chaîne ?", answer: 'À transmettre le mouvement', faux: ['À freiner', 'À diriger', 'À éclairer'], expl: "Elle transmet le mouvement du pédalier à la roue arrière." },
        { cat: 'Objets techniques', prompt: "Comment appelle-t-on le rôle de chaque élément d'un objet ?", answer: 'Sa fonction technique', faux: ['Sa fonction d\'usage', 'Son matériau', 'Son besoin'], expl: "Sa fonction technique : chaque pièce remplit un rôle précis dans l'ensemble." },
        { cat: 'Objets techniques', prompt: "Quel matériau est renouvelable ?", answer: 'Le bois', faux: ['Le pétrole', 'Le fer', 'Le verre'], expl: "Le bois repousse, à condition de replanter et d'exploiter raisonnablement." },
        { cat: 'Objets techniques', prompt: "Que vaut-il mieux faire avant de jeter un objet cassé ?", answer: 'Essayer de le réparer', faux: ['Le brûler', "L'enterrer", 'En racheter deux'], expl: "Réparer économise les ressources et l'énergie qu'il faudrait pour en fabriquer un neuf." },
        { cat: 'Objets techniques', prompt: "Pourquoi fabrique-t-on un objet technique ?", answer: 'Pour répondre à un besoin', faux: ['Par hasard', 'Pour décorer seulement', 'Pour consommer des ressources'], expl: "Tout objet technique naît d'un besoin humain à satisfaire." },
        { cat: 'Objets techniques', prompt: "Pourquoi choisit-on le métal pour une casserole ?", answer: 'Il résiste à la chaleur et la conduit', faux: ['Il est transparent', 'Il est très léger', 'Il est isolant'], expl: "Le métal supporte la chaleur sans fondre et la transmet vite aux aliments." }
      ]); } }
  ] },
  /* ========== Enseignement moral et civique ========== */
  { id: 'emc', emoji: '🏛️', title: 'Éducation civique', skills: [
    { id: 'emc-regles', title: 'Les règles et la loi', explanation: "Pourquoi il existe des règles, qui les fait, et ce qu'elles protègent.", levels: ['cm2', 'sixieme'],
      cours: [
        "Partout où l'on vit ensemble, il existe des <strong>règles</strong>. À l'école, c'est le <strong>règlement intérieur</strong> ; dans le pays, ce sont les <strong>lois</strong>. Les règles ne servent pas à embêter : elles protègent chacun et rendent la vie commune possible.",

function dicteesPourNiveau(niveau) { return DICTEES.filter(d => d.niveau === niveau); }

function getDomain(id) { return DOMAINS.find(d => d.id === id); }
function getSkill(domainId, skillId) { const d = getDomain(domainId); return d ? d.skills.find(s => s.id === skillId) : null; }
function skillsForLevel(domainId, level) { const d = getDomain(domainId); return d ? d.skills.filter(s => s.levels.includes(level)) : []; }
/* Un domaine sans compétence pour le niveau choisi n'a rien à montrer. Et sur
   le niveau Singapour, les domaines propres à la méthode passent devant : ce
   sont eux qu'on vient y chercher, pas les douze domaines communs. */
function domainesPourNiveau(level) {
  const dispo = DOMAINS.map(d => ({ d, n: skillsForLevel(d.id, level).length })).filter(x => x.n > 0);
  if (level !== 'singapour') return dispo;
  const propre = (x) => x.d.skills.every(s => s.levels.length === 1 && s.levels[0] === 'singapour');
  return [...dispo.filter(propre), ...dispo.filter(x => !propre(x))];
}

/* ================= État global ================= */
const LEVELS = [{ id: 'cm2', label: 'CM2' }, { id: 'sixieme', label: '6ème' }, { id: 'singapour', label: 'Singapour' }];
function levelLabel(id) { const l = LEVELS.find(x => x.id === id); return l ? l.label : id; }
const state = { screen: 'home', level: loadStore().level || 'cm2', currentDomain: null, currentSkill: null, mentalTrickId: null, quiz: null, dictee: null };
function setLevel(lvl) { state.level = lvl; const s = loadStore(); s.level = lvl; saveStore(s); render(); }
function clearTimer() { if (state.quiz && state.quiz.timerHandle) { clearInterval(state.quiz.timerHandle); state.quiz.timerHandle = null; } }

/* ================= Construction et moteur de quiz ================= */
/* Évite de retomber sur des questions identiques : on retente quelques fois,
   puis on accepte un doublon si le générateur a peu de combinaisons possibles. */
/* Histoire et géographie ne se génèrent pas : leurs questions sont écrites une
   à une dans une banque. On en tire au hasard, sans jamais reposer la même. */
function questionDeBanque(banque) {
  const b = banque[rnd(0, banque.length - 1)];
  return q({ category: b.cat, prompt: b.prompt, answer: b.answer, options: mkOptions(b.answer, b.faux), limit: b.limit || 25, expl: b.expl });
}

function pickDistinct(makeFn, keyFn, count) {
  const out = [], seen = new Set();
  for (let i = 0; i < count; i++) {
    let item = makeFn(), key = keyFn(item);
    /* 60 essais et non 20 : sur une banque de 10 questions dont 7 déjà tirées,
       20 essais laissaient encore repasser un doublon dans un quiz sur quarante */
    for (let a = 0; a < 60 && seen.has(key); a++) { item = makeFn(); key = keyFn(item); }
    seen.add(key); out.push(item);
  }
  return out;
}
const questionKey = (q) => [q.formula, q.prompt, q.svg, q.answer].join('|');
/* Pour les exemples d'une leçon on ignore le dessin : deux exemples de réponses
   différentes (angle aigu puis obtus, par exemple) sont plus parlants. */
const lessonKey = (q) => [q.formula, q.prompt, q.answer].join('|');
/* ---------- L'explication d'une réponse ----------
   On ne réécrit pas 262 explications à la main : les repères d'une leçon sont
   déjà les faits clés, et l'explication d'une compétence est déjà la règle.
   On pioche donc dans ce qui existe, dans cet ordre de précision. */
function repereQuiColle(skill, reponse) {
  if (!skill || !skill.reperes) return null;
  const norm = (x) => String(x).toLowerCase().replace(/\s+/g, ' ').trim();
  /* « La Loire » doit retrouver le repère « Loire » : on écarte l'article */
  const sansArticle = (x) => norm(x).replace(/^(le |la |les |l'|un |une |des |du |de la |d')/, '');
  const r = sansArticle(reponse);
  if (r.length < 3) return null;   // « Oui », « 8 » : trop court, on rapprocherait n'importe quoi

  /* Le rapprochement doit tomber sur un mot entier. Une simple inclusion de
     texte faisait répondre « 0 °C : l'eau gèle » à la question sur 100 °C. */
  const estAlphaNum = (c) => /[0-9a-zà-ÿ]/i.test(c);
  const contientMot = (phrase, mot) => {
    let i = phrase.indexOf(mot);
    while (i >= 0) {
      const avant = i === 0 ? ' ' : phrase[i - 1];
      const apres = i + mot.length >= phrase.length ? ' ' : phrase[i + mot.length];
      if (!estAlphaNum(avant) && !estAlphaNum(apres)) return true;
      i = phrase.indexOf(mot, i + 1);
    }
    return false;
  };

  /* l'égalité exacte d'abord, c'est le cas le plus sûr */
  const m = skill.reperes.find(([cle]) => sansArticle(cle) === r)
         || skill.reperes.find(([cle, val]) => contientMot(sansArticle(cle), r) || contientMot(norm(val), r));
  return m ? `${m[0]} : ${m[1]}` : null;
}
function explicationPour(skill, q) {
  if (q.expl) return q.expl;
  return repereQuiColle(skill, q.answer) || (skill && skill.explanation) || '';
}

/* ---------- Vitesse : des paliers par astuce ----------
   Chaque astuce a son propre palier. On monte quand on réussit presque tout
   ET vite ; le chrono se resserre alors, et à partir du palier « Rapide »
   on n'a plus de choix proposés : il faut écrire le résultat soi-même, ce qui
   interdit de deviner à partir du dernier chiffre. */
const PALIERS = [
  { nom: 'Débutant', emoji: '🐢', limite: 15, saisie: false },
  { nom: 'Apprenti', emoji: '🐇', limite: 11, saisie: false },
  { nom: 'Rapide', emoji: '🚲', limite: 12, saisie: true },
  { nom: 'Très rapide', emoji: '🏎️', limite: 9, saisie: true },
  { nom: 'Éclair', emoji: '⚡', limite: 7, saisie: true }
];
const SEUIL_PALIER = 85;       // 7 bonnes réponses sur 8 au moins
const RAPIDITE_PALIER = 0.6;   // et en moyenne moins de 60 % du temps permis
const SEUIL_MENTAL_JOUR = 70;  // pour valider l'étape obligatoire de la séance
const DUREE_SPRINT = 60;

function statTrick(id, level) { return ((loadStore().mental || {})[id + '-' + level]) || {}; }
function palierIndex(id, level) { return statTrick(id, level).palier || 0; }
function palierDe(id, level) { return PALIERS[palierIndex(id, level)]; }

/* Mémorise chaque réponse : taux de réussite et rapidité, en moyennes
   glissantes pour que les progrès récents comptent plus que les anciens. */
function noterReponseMentale(id, level, correct, temps, limite) {
  const s = loadStore(); s.mental = s.mental || {};
  const k = id + '-' + level, st = s.mental[k] || {};
  const ok = correct ? 1 : 0, rel = Math.min(1, temps / limite);
  st.taux = st.taux == null ? ok : st.taux * 0.7 + ok * 0.3;
  st.tempsRel = st.tempsRel == null ? rel : st.tempsRel * 0.7 + rel * 0.3;
  st.n = (st.n || 0) + 1;
  s.mental[k] = st; saveStore(s);
}
/* À la fin d'un entraînement sur UNE astuce : monter, rester ou redescendre. */
function ajusterPalier(id, level, pct, tempsMoyen) {
  const s = loadStore(); s.mental = s.mental || {};
  const k = id + '-' + level, st = s.mental[k] || {};
  const avant = st.palier || 0, lim = PALIERS[avant].limite;
  let apres = avant;
  if (pct >= SEUIL_PALIER && tempsMoyen <= lim * RAPIDITE_PALIER) apres = Math.min(PALIERS.length - 1, avant + 1);
  else if (pct < 50) apres = Math.max(0, avant - 1);
  let nouveauRecord = false;
  if (pct >= SEUIL_PALIER && (st.record == null || tempsMoyen < st.record)) { st.record = tempsMoyen; nouveauRecord = true; }
  st.palier = apres; s.mental[k] = st; saveStore(s);
  return { avant, apres, record: st.record, nouveauRecord, tempsMoyen };
}
/* Plus une astuce est ratée, lente ou à un palier bas, plus elle revient. */
function faiblesse(id, level) {
  const st = statTrick(id, level);
  if (!st.n) return 0.8;
  return 0.05 + (1 - st.taux) + 0.5 * st.tempsRel + 0.3 * (PALIERS.length - 1 - (st.palier || 0)) / (PALIERS.length - 1);
}
function tirerAstuces(level, count, ponderer) {
  const liste = tricksForLevel(level);
  const poids = liste.map(t => ponderer ? faiblesse(t.id, level) : 1);
  const total = poids.reduce((a, b) => a + b, 0), out = [];
  for (let i = 0; i < count; i++) {
    let x = Math.random() * total, j = 0;
    while (j < liste.length - 1 && x >= poids[j]) { x -= poids[j]; j++; }
    out.push(liste[j].id);
  }
  return out;
}

/* Les propositions : la bonne réponse, deux pièges typiques au plus, et des
   voisins pour compléter. */
function optionsMentales(ex) {
  const dec = ex.result % 1 !== 0 ? 1 : 0;
  const opts = new Set([ex.result]);
  for (const p of shuffle(ex.pieges || [])) {
    if (opts.size >= 3) break;
    if (Number.isFinite(p) && p > 0 && p !== ex.result) opts.add(p);
  }
  for (const v of numericOptions(ex.result, dec)) { if (opts.size >= 4) break; opts.add(v); }
  return shuffle([...opts]).map(formatNum);
}
function questionMentale(t, level, ex, opts) {
  const o = opts || {}, p = palierDe(t.id, level);
  const saisie = o.saisie !== undefined ? o.saisie : p.saisie;
  return { category: t.title, trickId: t.id, niveau: level, prompt: saisie ? 'Écris le résultat' : "Utilise l'astuce !", unit: '', svg: null,
    formula: ex.formula, answer: formatNum(ex.result), options: saisie ? [] : optionsMentales(ex), saisie,
    limit: o.limite || p.limite, expl: ex.breakdown || t.explanation };
}
function buildMentalQuiz(trickId, count) {
  const t = getTrick(trickId), level = state.level;
  /* l'astuce décompose déjà le calcul : c'est la meilleure explication possible */
  return pickDistinct(() => t.gen(level), (e) => e.formula, count).map(ex => questionMentale(t, level, ex));
}
/* Un quiz qui mélange plusieurs astuces, sans reposer deux fois le même calcul */
function buildMixQuiz(level, ids, opts) {
  const seen = new Set();
  return ids.map(id => {
    const t = getTrick(id); let ex = t.gen(level);
    for (let a = 0; a < 30 && seen.has(ex.formula); a++) ex = t.gen(level);
    seen.add(ex.formula);
    return questionMentale(t, level, ex, opts);
  });
}
/* Calcul mental du jour : 5 calculs sur l'astuce du jour, 5 révisions des points faibles */
function buildQuizDuJour(trickId, level) { return buildMixQuiz(level, shuffle([...Array(5).fill(trickId), ...tirerAstuces(level, 5, true)])); }
function buildRevision(level) { return buildMixQuiz(level, tirerAstuces(level, 10, true)); }
/* Sprint : toujours en QCM, pour que le record mesure la vitesse de calcul */
function buildSprint(level) { return buildMixQuiz(level, tirerAstuces(level, 120, false), { saisie: false, limite: DUREE_SPRINT }); }

/* La saisie au pavé : « 012,50 » devient « 12,5 », comme les réponses attendues */
function normaliserSaisie(s) {
  let v = s.replace('.', ',');
  if (v.includes(',')) v = v.replace(/0+$/, '').replace(/,$/, '');
  return v.replace(/^0+(?=\d)/, '');
}
function toucher(k) {
  const qz = state.quiz; if (!qz || qz.answered || qz.pause) return;
  const cur = qz.questions[qz.index]; if (!cur.saisie) return;
  if (k === '⌫') qz.saisie = qz.saisie.slice(0, -1);
  else if (k === ',') { if (qz.saisie && !qz.saisie.includes(',')) qz.saisie += ','; }
  else if (qz.saisie.length < 8) qz.saisie += k;
  render();
}
function validerSaisie() {
  const qz = state.quiz; if (!qz || qz.answered || qz.pause || !qz.saisie) return;
  const v = normaliserSaisie(qz.saisie);
  qz.lastChosen = v; answerQuiz(v);
}
/* le clavier de l'ordinateur marche aussi : chiffres, virgule, effacer, Entrée */
document.addEventListener('keydown', (e) => {
  if (state.screen !== 'quiz' || !state.quiz) return;
  const qz = state.quiz, cur = qz.questions[qz.index];
  if (e.key === 'Enter' && qz.attenteCorrection) { e.preventDefault(); questionSuivante(); return; }
  if (!cur.saisie) return;
  if (/^[0-9]$/.test(e.key)) toucher(e.key);
  else if (e.key === ',' || e.key === '.') toucher(',');
  else if (e.key === 'Backspace') { e.preventDefault(); toucher('⌫'); }
  else if (e.key === 'Enter') { e.preventDefault(); validerSaisie(); }
});
function buildSkillQuiz(domainId, skillId, count) {
  const skill = getSkill(domainId, skillId);
  const qs = pickDistinct(() => skill.question(state.level), questionKey, count);
  /* on fige l'explication ici : l'écran de résultat n'aura plus besoin de
     retrouver la compétence d'origine pour l'afficher */
  qs.forEach(q => { q.expl = explicationPour(skill, q); });
  return qs;
}
/* `extra` précise le mode : { sprint: true } pour le sprint chronométré,
   { trickId } pour l'entraînement sur une seule astuce (paliers de vitesse). */
function startQuiz(kind, builderFn, bestKey, extra) {
  clearTimer();
  const questions = builderFn(), x = extra || {};
  state.quiz = { kind, rebuild: builderFn, bestKey, extra: x, sprint: !!x.sprint, trickId: x.trickId, niveau: x.niveau, index: 0, score: 0, questions, answered: false, lastChosen: null,
    timeLeft: x.sprint ? DUREE_SPRINT : questions[0].limit, timerHandle: null, times: [], catStats: {}, pause: false, gain: null, erreurs: [], attenteCorrection: false,
    saisie: '', debutQuestion: Date.now(), pauseDebut: null };
  state.screen = 'quiz'; render(); runTimer();
}
function runTimer() {
  clearTimer();
  state.quiz.timerHandle = setInterval(() => {
    const qz = state.quiz;
    if (!qz || qz.pause) return;
    /* en sprint, le chrono est global : il tourne même pendant l'affichage de la correction */
    if (qz.sprint) { qz.timeLeft--; if (qz.timeLeft <= 0) finirQuiz(); else render(); return; }
    if (qz.answered) return;
    qz.timeLeft--;
    if (qz.timeLeft <= 0) { clearTimer(); answerQuiz(null); } else render();
  }, 1000);
}
function basculerPause() {
  const qz = state.quiz; qz.pause = !qz.pause;
  /* le temps de pause ne compte pas dans le temps de réponse */
  if (qz.pause) qz.pauseDebut = Date.now();
  else if (qz.pauseDebut) { qz.debutQuestion += Date.now() - qz.pauseDebut; qz.pauseDebut = null; }
  render();
}
function questionSuivante() {
  const qz = state.quiz;
  qz.attenteCorrection = false;
  if (qz.index < qz.questions.length - 1) {
    qz.index++; qz.answered = false; qz.lastChosen = null; qz.saisie = ''; qz.debutQuestion = Date.now();
    if (!qz.sprint) { qz.timeLeft = qz.questions[qz.index].limit; runTimer(); }
    render(); return;
  }
  finirQuiz();
}
function finirQuiz() {
  const qz = state.quiz; clearTimer();
  qz.attenteCorrection = false;
  const total = qz.sprint ? qz.times.length : qz.questions.length;
  const pct = total ? Math.round((qz.score / total) * 100) : 0;
  qz.total = total;
  if (qz.sprint) { qz.recordAvant = getBest(qz.bestKey) || 0; saveBest(qz.bestKey, qz.score); }
  else if (qz.bestKey) saveBest(qz.bestKey, pct);
  if (qz.trickId && total) qz.palier = ajusterPalier(qz.trickId, qz.niveau, pct, qz.times.reduce((a, b) => a + b, 0) / total);
  /* un sprint de 3 réponses ne mérite pas de jeton, même à 100 % */
  qz.gain = qz.sprint && total < 10 ? null : attribuerRecompense(pct);
  if (qz.etapeSeance !== undefined) {
    const e = construireSeance(jourCle())[qz.etapeSeance];
    qz.etapeValidee = !(e && e.type === 'mental') || pct >= SEUIL_MENTAL_JOUR;
    if (qz.etapeValidee) marquerEtape(qz.etapeSeance);
  }
  state.screen = 'quizResults'; render();
}

function answerQuiz(chosen) {
  const qz = state.quiz; const cur = qz.questions[qz.index];
  if (qz.answered) return;
  qz.answered = true;
  if (!qz.sprint) clearTimer();
  const correct = chosen !== null && chosen === cur.answer;
  const timeUsed = chosen === null ? cur.limit : Math.min(cur.limit, Math.round((Date.now() - qz.debutQuestion) / 100) / 10);
  qz.times.push(timeUsed);
  if (cur.trickId) noterReponseMentale(cur.trickId, cur.niveau, correct, timeUsed, qz.sprint ? PALIERS[0].limite : cur.limit);
  if (!qz.catStats[cur.category]) qz.catStats[cur.category] = { correct: 0, total: 0 };
  qz.catStats[cur.category].total++;
  if (correct) { qz.score++; qz.catStats[cur.category].correct++; }
  else qz.erreurs.push({ q: cur, choisi: chosen, numero: qz.index + 1 });
  /* En sprint, on enchaîne toujours : la correction est relue à la fin.
     Sinon, une bonne réponse enchaîne toute seule et une mauvaise s'arrête
     sur la correction : c'est l'enfant qui décide quand il a fini de lire. */
  if (qz.sprint) {
    render();
    setTimeout(() => { if (state.quiz === qz && qz.answered && state.screen === 'quiz') questionSuivante(); }, correct ? 350 : 1300);
    return;
  }
  qz.attenteCorrection = !correct;
  render();
  if (!correct) return;
  setTimeout(() => { if (state.quiz === qz && qz.answered) questionSuivante(); }, 1100);
}


/* ---------- La voix ---------- */
/* Les voix du navigateur arrivent de façon asynchrone : tant qu'elles ne sont
   pas chargées, getVoices() renvoie une liste vide. On réaffiche l'écran dès
   qu'elles arrivent pour que le bouton « Écouter » cesse d'être grisé. */
let voixPretes = false;
function voixFrancaise() {
  if (!('speechSynthesis' in window)) return null;
  const voix = speechSynthesis.getVoices();
  return voix.find(v => v.lang === 'fr-FR') || voix.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || null;
}
function lectureDisponible() { return 'speechSynthesis' in window && voixFrancaise() !== null; }
if ('speechSynthesis' in window) {
  speechSynthesis.addEventListener('voiceschanged', () => {
    voixPretes = true;
    if (state.screen === 'dictee') render();
  });
}

function direTexte(texte, vitesse) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = 'fr-FR';
  /* Choisir la voix est un confort, pas une nécessité : si l'appareil refuse
     celle qu'on lui propose, on lit quand même avec la voix par défaut plutôt
     que de laisser l'enfant devant un bouton muet. */
  try { const v = voixFrancaise(); if (v) u.voice = v; } catch (e) { /* voix par défaut */ }
  u.rate = vitesse;      // 0.7 en lecture lente, 0.95 en normale
  speechSynthesis.speak(u);
}
function stopperVoix() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ---------- Découpage et comparaison ---------- */
function phrasesDe(texte) {
  return texte.match(/[^.!?…]+[.!?…]*/g).map(s => s.trim()).filter(Boolean);
}
function motsDe(texte) { return texte.trim().split(/\s+/).filter(Boolean); }

/* La ponctuation n'est pas comptée comme faute, mais les accents et les
   majuscules le sont : c'est ce qui fait tout l'intérêt d'une dictée. */
function normaliserMot(mot) {
  return mot.replace(/[’ʼ]/g, "'")          // apostrophe typographique
            .replace(/^[«»"'“”(\[]+/, '')
            .replace(/[.,;:!?…«»"'“”)\]]+$/, '');
}

/* Alignement par plus longue sous-suite commune : il repère les mots oubliés
   et les mots en trop au lieu de tout décaler après la première erreur. */
function alignerMots(attendus, ecrits) {
  const n = attendus.length, m = ecrits.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = attendus[i] === ecrits[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const brut = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (attendus[i] === ecrits[j]) brut.push({ type: 'ok', a: i++, e: j++ });
    else if (dp[i + 1][j] >= dp[i][j + 1]) brut.push({ type: 'oubli', a: i++ });
    else brut.push({ type: 'ajout', e: j++ });
  }
  while (i < n) brut.push({ type: 'oubli', a: i++ });
  while (j < m) brut.push({ type: 'ajout', e: j++ });

  /* Un mot oublié qui fait face à un mot en trop, c'est en réalité un mot mal
     écrit. On traite chaque série d'erreurs d'un bloc et on apparie dans
     l'ordre : sinon, sur deux erreurs qui se suivent, le mot saisi se
     retrouverait confronté au mot attendu de l'erreur voisine. */
  const res = [];
  for (let k = 0; k < brut.length; ) {
    if (brut[k].type === 'ok') { res.push(brut[k++]); continue; }
    let fin = k;
    while (fin < brut.length && brut[fin].type !== 'ok') fin++;
    const serie = brut.slice(k, fin);
    const oublis = serie.filter(x => x.type === 'oubli'), ajouts = serie.filter(x => x.type === 'ajout');
    const paires = Math.min(oublis.length, ajouts.length);
    for (let i = 0; i < paires; i++) res.push({ type: 'faute', a: oublis[i].a, e: ajouts[i].e });
    for (let i = paires; i < oublis.length; i++) res.push(oublis[i]);
    for (let i = paires; i < ajouts.length; i++) res.push(ajouts[i]);
    k = fin;
  }
  return res;
}

/* Un signe de ponctuation isolé (« ! » précédé d'une espace) n'est pas un mot :
   comme la ponctuation est tolérée, il ne doit pas compter comme mot en trop. */
function motsComparables(texte) {
  const out = [];
  for (const mot of motsDe(texte)) { const n = normaliserMot(mot); if (n) out.push({ mot, n }); }
  return out;
}

function corrigerDictee(attendu, saisi) {
  const A = motsComparables(attendu), E = motsComparables(saisi);
  const align = alignerMots(A.map(x => x.n), E.map(x => x.n));
  const justes = align.filter(x => x.type === 'ok').length;
  const total = A.length;
  return { align, motsAttendus: A.map(x => x.mot), motsEcrits: E.map(x => x.mot), justes, total, pct: total ? Math.round(justes / total * 100) : 0 };
}

/* ---------- Les écrans de la dictée ---------- */
function renderDicteeList() {
  const liste = dicteesPourNiveau(state.level);
  const cartes = liste.map(d => {
    const best = getBest('dictee-' + d.id);
    return `<div class="trick-card" data-action="open-dictee" data-id="${d.id}"><div class="trick-emoji">✍️</div><div class="trick-info"><div class="trick-title">${d.titre}</div><div class="mode-desc">${motsDe(d.texte).length} mots · ${d.points}</div>${best !== undefined ? `<div class="trick-progress">✓ Meilleur score : ${best}%</div>` : ''}</div><div class="mode-arrow">→</div></div>`;
  }).join('');
  const alerte = lectureDisponible() ? '' : `<div class="voix-alerte">🔇 Aucune voix française n'a été trouvée sur cet appareil. La dictée peut être lue par un adulte : le texte reste caché jusqu'à la correction.</div>`;
  return `<div class="screen screen-liste"><button class="btn-back" data-action="go-home">← Retour</button>
    <h1>✍️ Dictée</h1><p class="subtitle">Niveau ${levelLabel(state.level)}</p>
    ${alerte}<div class="cartes">${cartes}</div></div>`;
}

function renderDictee() {
  const d = getDictee(state.dictee.id);
  const phrases = phrasesDe(d.texte);
  const i = state.dictee.phrase;
  const lente = state.dictee.vitesse < 0.85;

/* ================= La séance du jour ================= */
/* Trois étapes tirées au sort mais STABLES pour la journée : l'enfant doit
   retrouver la même séance s'il ferme et rouvre l'app. On sème donc le tirage
   avec la date, au lieu d'utiliser Math.random. */
function jourCle(d) {
  const x = d || new Date();
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function veilleDe(cle) {
  const [a, m, j] = cle.split('-').map(Number);
  const d = new Date(a, m - 1, j); d.setDate(d.getDate() - 1);
  return jourCle(d);
}
/* générateur pseudo-aléatoire semé : même date, même séance */
function semeur(graine) {
  let h = 2166136261;
  for (let i = 0; i < graine.length; i++) { h ^= graine.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

const MATIERES_CULTURE = ['histoire', 'geographie', 'sciences', 'emc'];

/* La séance mélange CM2 et 6ème dans la même journée, comme demandé : le
   calcul mental (obligatoire, il ouvre la séance), une étape de maths, une
   leçon à relire, et le quiz de cette leçon. */
function construireSeance(cle) {
  const rnd01 = semeur(cle);
  const tire = (arr) => arr[Math.floor(rnd01() * arr.length)];
  const niveaux = ['cm2', 'sixieme'];

  /* Maths : on privilégie les domaines de la méthode de Singapour, c'est la
     façon de raisonner qu'on veut installer. */
  const nivMaths = tire(niveaux);
  const domsSg = ['barres', 'rapports', 'vitesse', 'cercle', 'algebre', 'volume', 'diagrammes'];
  const sgDispo = domsSg.filter(d => skillsForLevel(d, 'singapour').length);
  const versSingapour = rnd01() < 0.5 && sgDispo.length;
  const domMaths = versSingapour ? tire(sgDispo) : tire(['nombres', 'multiplication', 'division', 'fractions', 'decimaux', 'calculs', 'pourcentages', 'mesures'].filter(d => skillsForLevel(d, nivMaths).length));
  const nivEtape1 = versSingapour ? 'singapour' : nivMaths;
  const skMaths = tire(skillsForLevel(domMaths, nivEtape1));

  /* Culture : l'autre niveau que celui des maths, pour couvrir les deux dans
     la même séance. */
  const nivCulture = nivMaths === 'cm2' ? 'sixieme' : 'cm2';
  const domsCulture = MATIERES_CULTURE.filter(d => skillsForLevel(d, nivCulture).length);
  const domCulture = tire(domsCulture);
  const skCulture = tire(skillsForLevel(domCulture, nivCulture));

  /* L'astuce du jour, au niveau des maths du jour. Tirée APRÈS les autres
     étapes pour ne pas changer le reste de la séance d'un jour donné. */
  const astuce = tire(tricksForLevel(nivEtape1));

  return [
    { id: 'mental', titre: 'Calcul mental · obligatoire', detail: `Astuce du jour : ${astuce.title} + révisions`, emoji: '🧠',
      niveau: nivEtape1, trick: astuce.id, type: 'mental' },
    { id: 'maths', titre: 'Maths', detail: `${getDomain(domMaths).title} · ${skMaths.title}`, emoji: getDomain(domMaths).emoji,
      niveau: nivEtape1, domaine: domMaths, skill: skMaths.id, type: 'quiz' },
    { id: 'lecon', titre: 'La leçon du jour', detail: `${getDomain(domCulture).title} · ${skCulture.title}`, emoji: getDomain(domCulture).emoji,
      niveau: nivCulture, domaine: domCulture, skill: skCulture.id, type: 'lecon' },
    { id: 'quiz-culture', titre: 'Le quiz de la leçon', detail: `${getDomain(domCulture).title} · ${skCulture.title}`, emoji: '✅',
      niveau: nivCulture, domaine: domCulture, skill: skCulture.id, type: 'quiz' }
  ];
}

const NB_ETAPES = 4;
function seanceValide(seance, cle) { return seance && seance.date === cle && seance.faits.length === NB_ETAPES; }
function etatSeance() {
  const cle = jourCle(), s = loadStore();
  /* un nouveau jour remet les étapes à zéro, sans toucher à la série */
  if (!seanceValide(s.seance, cle)) return { date: cle, faits: Array(NB_ETAPES).fill(false) };
  return s.seance;
}
function marquerEtape(i) {
  const cle = jourCle(), s = loadStore();
  const seance = seanceValide(s.seance, cle) ? s.seance : { date: cle, faits: Array(NB_ETAPES).fill(false) };
  if (seance.faits[i]) return;
  seance.faits[i] = true;
  s.seance = seance;
  /* Série de jours : elle ne s'incrémente qu'une fois toutes les étapes faites,
     et repart à 1 si un jour a été sauté. */
  if (seance.faits.every(Boolean) && s.serieJour !== cle) {
    s.serie = (s.serieDernier === veilleDe(cle)) ? (s.serie || 0) + 1 : 1;
    s.serieDernier = cle; s.serieJour = cle;
  }
  saveStore(s);
}
function getSerie() { const s = loadStore(); if (!s.serieDernier) return 0; return (s.serieDernier === jourCle() || s.serieDernier === veilleDe(jourCle())) ? (s.serie || 0) : 0; }

function renderSeance() {
  const etapes = construireSeance(jourCle()), etat = etatSeance();
  const faits = etat.faits.filter(Boolean).length;
  const fini = faits === etapes.length;
  const serie = getSerie();
  /* le calcul mental est obligatoire : tant qu'il n'est pas réussi, le reste
     de la séance reste fermé */
  const lignes = etapes.map((e, i) => {
    const verrou = i > 0 && !etat.faits[0];
    return `<div class="etape ${etat.faits[i] ? 'faite' : ''} ${verrou ? 'verrou' : ''}" ${verrou ? '' : `data-action="etape-seance" data-i="${i}"`}>
      <div class="etape-coche">${etat.faits[i] ? '✓' : verrou ? '🔒' : i + 1}</div>
      <div class="etape-info"><div class="etape-titre">${e.emoji} ${e.titre}</div><div class="etape-detail">${verrou ? 'Réussis d\'abord le calcul mental' : `${e.detail} · ${levelLabel(e.niveau)}`}</div></div>
      <div class="mode-arrow">${etat.faits[i] || verrou ? '' : '→'}</div>
    </div>`;
  }).join('');
  return `<div class="seance ${fini ? 'seance-finie' : ''}">
    <div class="seance-head">
      <div><div class="seance-titre">${fini ? '🎉 Séance du jour terminée !' : '📅 Ta séance du jour'}</div><div class="seance-sous">${fini ? 'Reviens demain pour continuer ta série.' : `${faits} sur ${etapes.length} · environ 15 minutes`}</div></div>
      ${serie ? `<div class="serie" title="jours d'affilée">🔥 ${serie}</div>` : ''}
    </div>
    <div class="seance-barre"><div class="seance-barre-jauge" style="width:${Math.round(faits / etapes.length * 100)}%"></div></div>
    ${lignes}
  </div>`;
}

/* Ouvre l'étape demandée. L'étape « leçon » est validée à la lecture, les
   étapes « quiz » le sont à la fin du quiz. */
function ouvrirEtape(i) {
  const e = construireSeance(jourCle())[i];
  if (i > 0 && !etatSeance().faits[0]) return;
  setLevel(e.niveau);
  /* le calcul mental s'ouvre sur la leçon de l'astuce du jour, avec son bouton de départ */
  if (e.type === 'mental') { state.currentDomain = 'astuces'; state.mentalTrickId = e.trick; state.etapeMentale = i; state.screen = 'mentalLesson'; render(); return; }
  state.currentDomain = e.domaine; state.currentSkill = e.skill;
  if (e.type === 'lecon') { marquerEtape(i); state.screen = 'skillLesson'; render(); return; }
  state.screen = 'skillLesson'; render();
  startQuiz('skill', () => buildSkillQuiz(e.domaine, e.skill, 8), 'skill-' + e.domaine + '-' + e.skill + '-' + e.niveau);
  state.quiz.etapeSeance = i;
}

/* ================= Rendu ================= */
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'skillList') app.innerHTML = renderSkillList();
  else if (state.screen === 'mentalLesson') app.innerHTML = renderMentalLesson();
  else if (state.screen === 'skillLesson') app.innerHTML = renderSkillLesson();
  else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (state.screen === 'quizResults') app.innerHTML = renderQuizResults();
  else if (state.screen === 'dicteeList') app.innerHTML = renderDicteeList();
  else if (state.screen === 'dictee') app.innerHTML = renderDictee();
  else if (state.screen === 'dicteeResult') app.innerHTML = renderDicteeResult();
  attachListeners();
}
function attachListeners() {
  document.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', onAction));
  const saisie = document.getElementById('dictee-saisie');
  /* on garde la frappe dans l'état sans réafficher l'écran : un rendu à chaque
     lettre ferait perdre le curseur et le clavier du téléphone */
  if (saisie) saisie.addEventListener('input', (e) => { state.dictee.saisi = e.target.value; });
}

/* Le coffre à jetons, visible dès l'accueil : c'est ce qui donne envie de
   relancer un quiz. Les jetons et les hamsters sont communs aux trois niveaux. */
function renderRecompenses() {
  const jetons = getJetons(), hamsters = getHamsters();
  const cases = Array.from({ length: JETONS_PAR_HAMSTER }, (_, i) => `<span class="token${i < jetons ? '' : ' vide'}">🐱</span>`).join('');
  return `<div class="reward-strip">
    <div class="reward-head"><span class="reward-label">Mes jetons chatons</span><span class="reward-count">${jetons} / ${JETONS_PAR_HAMSTER}</span></div>
    <div class="token-row">${cases}</div>
    ${hamsters ? `<div class="reward-hamsters">🐹 ${hamsters} hamster${hamsters > 1 ? 's' : ''} gagné${hamsters > 1 ? 's' : ''} !</div>` : `<div class="reward-hamsters">Encore ${JETONS_PAR_HAMSTER - jetons} chaton${JETONS_PAR_HAMSTER - jetons > 1 ? 's' : ''} pour gagner un hamster 🐹</div>`}
  </div>`;
}

    /* la dictée est un exercice de français : elle n'a pas sa place dans un programme de maths singapourien */
    ...(dicteesPourNiveau(state.level).length ? [{ id: 'dictee', emoji: '✍️', title: 'Dictée', desc: `${dicteesPourNiveau(state.level).length} textes lus à voix haute` }] : []),
    ...domainesPourNiveau(state.level).map(({ d, n }) => ({ id: d.id, emoji: d.emoji, title: d.title, desc: `${n} compétence${n > 1 ? 's' : ''}` }))]

    </div>`;
    return `<div class="screen screen-liste"><button class="btn-back" data-action="go-home">← Retour</button><h1>🧠 Astuces calcul mental</h1><p class="subtitle">Niveau ${levelLabel(lvl)} · ${maitrise} / ${list.length} astuces au palier 🚲 Rapide ou plus</p>

function renderMentalLesson() {
  const t = getTrick(state.mentalTrickId);
  const [ex1, ex2] = pickDistinct(() => t.gen(state.level), (e) => e.formula, 2);
  return `<div class="screen screen-lecon"><button class="btn-back" data-action="back-to-list">← Retour</button>

      <button class="btn btn-secondary" data-action="regen">🔀 De nouveaux exemples</button>
      <button class="btn ${state.etapeMentale !== undefined ? 'btn-secondary' : 'btn-primary'}" data-action="start-mental-quiz">✨ Pratiquer cette astuce (8 calculs · ${palierDe(t.id, state.level).limite} s)</button></div>
  </div>`;

/* Où en est l'enfant sur cette astuce, et ce qu'il faut pour monter */
function renderVitesseAstuce(id, level) {
  const i = palierIndex(id, level), p = PALIERS[i], st = statTrick(id, level);
  const points = PALIERS.map((x, k) => `<span class="palier-point ${k <= i ? 'atteint' : ''}" title="${x.nom}">${x.emoji}</span>`).join('');
  const suite = i < PALIERS.length - 1
    ? `Pour passer ${PALIERS[i + 1].emoji} ${PALIERS[i + 1].nom} : au moins 7/8, en moins de ${formatNum(Math.round(p.limite * RAPIDITE_PALIER * 10) / 10)} s en moyenne.`
    : 'Tu es au palier le plus rapide. Bats ton record !';
  return `<div class="vitesse-card"><div class="vitesse-titre">Ta vitesse : ${p.emoji} ${p.nom}</div><div class="palier-ligne">${points}</div>
    <div class="vitesse-texte">${p.limite} s par calcul · ${p.saisie ? 'tu écris le résultat' : 'choix multiples'}${st.record != null ? ` · record : ${formatNum(Math.round(st.record * 10) / 10)} s en moyenne` : ''}</div>
    <div class="vitesse-texte">${suite}</div></div>`;
}

/* La leçon d'histoire ou de géographie : un texte à lire, des repères à
   retenir, puis le quiz. Pas d'exemples générés ici, il n'y a rien à tirer. */
function renderCours(s, d) {
  const reperes = s.reperes ? `<div class="reperes">${s.reperes.map(r => `<div class="repere"><span class="repere-cle">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>` : '';
  return `<div class="screen screen-lecon"><button class="btn-back" data-action="back-to-list">← Retour</button>
    <div class="lesson-hero"><div class="lesson-emoji">${d.emoji}</div><div class="lesson-title">${s.title}</div><div class="lesson-explanation">${s.explanation}</div></div>
    <div class="section-label">La leçon</div>
    <div class="cours-card">${s.cours.map(par => `<p>${par}</p>`).join('')}${reperes}</div>
    <div class="btn-stack" style="margin-top:0.5rem;"><button class="btn btn-primary" data-action="start-skill-quiz">✨ Pratiquer (8 questions, chrono)</button></div>
  </div>`;
}

function renderSkillLesson() {
  const s = getSkill(state.currentDomain, state.currentSkill); const d = getDomain(state.currentDomain);
  if (s.cours) return renderCours(s, d);
  const [ex1, ex2] = pickDistinct(() => s.question(state.level), lessonKey, 2);
  const exCard = (ex) => `<div class="step-card">${ex.formula ? `<div class="step-formula">${ex.formula}</div>` : `<div class="step-breakdown" style="margin-top:0;">${ex.prompt}</div>`}${ex.svg ? `<div class="step-shape">${ex.svg}</div>` : ''}<div class="step-result">Réponse : ${ex.answer}${ex.unit ? ' ' + ex.unit : ''}</div></div>`;
  return `<div class="screen screen-lecon"><button class="btn-back" data-action="back-to-list">← Retour</button>
    <div class="lesson-hero"><div class="lesson-emoji">${d.emoji}</div><div class="lesson-title">${s.title}</div><div class="lesson-explanation">${s.explanation}</div></div>
    <div class="section-label">Exemples</div>
    <div class="exemples">${exCard(ex1)}${exCard(ex2)}</div>
    <div class="btn-stack" style="margin-top:0.5rem;"><button class="btn btn-secondary" data-action="regen">🔀 De nouveaux exemples</button><button class="btn btn-primary" data-action="start-skill-quiz">✨ Pratiquer (8 questions, chrono)</button></div>
  </div>`;
}

function renderQuiz() {
  const qz = state.quiz; const cur = qz.questions[qz.index]; const total = qz.questions.length;
  const duree = qz.sprint ? DUREE_SPRINT : cur.limit;
  const pctLeft = Math.max(0, Math.round((qz.timeLeft / duree) * 100));
  const low = qz.timeLeft <= Math.ceil(duree * 0.3);
  const bloque = qz.answered || qz.pause;
  const optionsHtml = cur.saisie ? `<div class="saisie-zone">
      <div class="saisie-affichage ${qz.answered ? (qz.lastChosen === cur.answer ? 'ok' : 'ko') : ''}">${qz.saisie || '<span class="saisie-vide">?</span>'}</div>
      <div class="pave">${['7', '8', '9', '4', '5', '6', '1', '2', '3', ',', '0', '⌫'].map(k => `<button class="pave-touche" data-action="touche" data-k="${k}" ${bloque ? 'disabled' : ''}>${k}</button>`).join('')}</div>
      <button class="btn btn-primary" data-action="valider-saisie" ${bloque || !qz.saisie ? 'disabled' : ''}>Valider ✓</button>
    </div>` : cur.options.map(opt => { let cls = 'option-btn'; if (qz.answered) { if (opt === cur.answer) cls += ' correct'; else if (opt === qz.lastChosen) cls += ' wrong'; } return `<button class="${cls}" data-action="answer-quiz" data-value="${opt}" ${qz.answered || qz.pause ? 'disabled' : ''}>${opt}</button>`; }).join('');
  const faux = qz.answered && qz.lastChosen !== cur.answer && !qz.sprint;
  const fauxSprint = qz.sprint && qz.answered && qz.lastChosen !== cur.answer;
  const expl = cur.expl ? `<div class="correction-expl"><div class="correction-expl-titre">Pourquoi ?</div>${cur.expl}</div>` : '';
  const carteCorrection = faux ? `<div class="correction">
      <div class="correction-titre">Correction</div>
      <div class="correction-ligne">${qz.lastChosen ? `Ta réponse : <s>${qz.lastChosen}</s>` : "Le temps est écoulé."}</div>
      <div class="correction-ligne">Bonne réponse : <span class="correction-bonne">${cur.answer}${cur.unit ? ' ' + cur.unit : ''}</span></div>
      ${expl}
      <div class="btn-stack" style="margin-top:0.8rem;"><button class="btn btn-primary" data-action="continuer-quiz">J'ai compris, continuer →</button></div>
    </div>` : '';
  const carteQuestion = qz.pause
    ? `<div class="pause-panel"><div class="pause-emoji">⏸️</div><div class="pause-title">Pause</div><div class="pause-note">Le chrono est arrêté. La question réapparaîtra quand tu reprendras.</div></div>`
    : `<div class="question-card">
      ${cur.formula ? `<div class="question-label">${cur.prompt}</div><div class="question-formula">${cur.formula}</div>` : `<div class="question-label">${cur.prompt}</div>${cur.svg ? `<div class="question-shape">${cur.svg}</div>` : ''}${cur.unit ? `<div style="font-size:0.78rem;color:var(--text-secondary);">Réponse en ${cur.unit}</div>` : ''}`}
    </div>`;
  return `<div class="screen screen-quiz">
    <div class="quiz-topbar"><div class="quiz-progress">${qz.sprint ? `⚡ Sprint · ${qz.times.length} réponse${qz.times.length > 1 ? 's' : ''}` : `${cur.category} · ${qz.index + 1}/${total}`}</div><button class="btn-pause" data-action="toggle-pause">${qz.pause ? '▶ Reprendre' : '⏸ Pause'}</button><div class="quiz-score">⭐ ${qz.score}</div></div>
    <div class="timer-wrap"><div class="timer-bar-bg"><div class="timer-bar-fill ${low ? 'low' : ''}" style="width:${pctLeft}%"></div></div><div class="timer-num">${Math.max(0, qz.timeLeft)} s</div></div>
    ${carteQuestion}
    ${cur.saisie ? optionsHtml : `<div class="options-grid">${optionsHtml}</div>`}
    ${fauxSprint ? `<div class="correction"><div class="correction-ligne">Bonne réponse : <span class="correction-bonne">${cur.answer}</span></div></div>` : ''}
    ${carteCorrection}
  </div>`;
}

/* Ce qui vient d'être gagné, annoncé juste sous le score. `gain` est calculé
   une seule fois en fin de quiz, jamais au moment du rendu. */
function renderGain(gain, pct) {
  if (!gain) return '';
  if (gain.hamster) return `<div class="hamster-card"><div class="hamster-emoji">🐹</div><div class="hamster-title">Tu as gagné un hamster !</div><div class="hamster-note">${JETONS_PAR_HAMSTER} jetons chatons échangés. Tu en as maintenant ${gain.hamsters} au total.</div></div>`;
  if (gain.jeton) return `<div class="gain-card"><div class="gain-emoji">🐱</div><div class="gain-text">+1 jeton chaton !</div><div class="gain-sub">${gain.jetons} / ${JETONS_PAR_HAMSTER} — encore ${JETONS_PAR_HAMSTER - gain.jetons} pour un hamster 🐹</div></div>`;
  /* « presque » n'a de sens que si le score en est vraiment proche */
  const encouragement = pct >= SEUIL_JETON - 20 ? `Tu y es presque : ${pct} % cette fois.` : `Tu as obtenu ${pct} %. Relis la leçon, puis retente ta chance !`;
  return `<div class="gain-card" style="background:var(--warning-bg);border-color:#E8C98A;"><div class="gain-text" style="color:#8A5510;">Il faut ${SEUIL_JETON} % pour gagner un jeton chaton 🐱</div><div class="gain-sub">${encouragement}</div></div>`;
}

/* Le récapitulatif des erreurs : c'est là que se fait le vrai apprentissage,
   une fois la pression du chrono retombée. */
function renderARevoir(erreurs) {
  if (!erreurs || !erreurs.length) return '';
  const cartes = erreurs.map(e => `<div class="revoir">
    <div class="revoir-num">Question ${e.numero} · ${e.q.category}</div>
    <div class="revoir-question">${e.q.formula ? e.q.formula : e.q.prompt}</div>
    ${e.q.svg ? `<div class="question-shape">${e.q.svg}</div>` : ''}
    <div class="revoir-reponses">${e.choisi ? `Ta réponse : <s>${e.choisi}</s><br>` : 'Pas de réponse à temps.<br>'}Bonne réponse : <span class="correction-bonne">${e.q.answer}${e.q.unit ? ' ' + e.q.unit : ''}</span></div>
    ${e.q.expl ? `<div class="revoir-expl">${e.q.expl}</div>` : ''}
  </div>`).join('');
  return `<div class="section-label">À revoir · ${erreurs.length} erreur${erreurs.length > 1 ? 's' : ''}</div>${cartes}`;
}

/* Ce que l'entraînement a changé à la vitesse : palier, record, sprint */
function renderBilanVitesse(qz) {
  if (qz.sprint) {
    const nouveau = qz.score > qz.recordAvant;
    return `<div class="vitesse-card"><div class="vitesse-titre">${nouveau ? '🏅 Nouveau record !' : '⏱️ Sprint terminé'}</div>
      <div class="vitesse-texte">${qz.score} bonne${qz.score > 1 ? 's' : ''} réponse${qz.score > 1 ? 's' : ''} en ${DUREE_SPRINT} s${nouveau ? (qz.recordAvant ? ` (ancien record : ${qz.recordAvant})` : '') : ` · ton record : ${qz.recordAvant}`}</div></div>`;
  }
  if (!qz.palier) return '';
  const { avant, apres, nouveauRecord, tempsMoyen } = qz.palier, pa = PALIERS[avant], pn = PALIERS[apres];
  let msg;
  if (apres > avant) msg = `Tu passes au palier ${pn.emoji} ${pn.nom} : ${pn.limite} s par calcul.${pn.saisie && !pa.saisie ? ' Désormais, tu écris toi-même le résultat !' : ''}`;
  else if (apres < avant) msg = `On revient au palier ${pn.emoji} ${pn.nom} pour consolider. Relis bien l'astuce.`;
  else if (apres === PALIERS.length - 1) msg = 'Tu restes au palier le plus rapide.';
  else msg = `Pour passer ${PALIERS[apres + 1].emoji} ${PALIERS[apres + 1].nom} : au moins 7/8 en moins de ${formatNum(Math.round(pa.limite * RAPIDITE_PALIER * 10) / 10)} s en moyenne (cette fois : ${formatNum(Math.round(tempsMoyen * 10) / 10)} s).`;
  return `<div class="vitesse-card ${apres > avant ? 'monte' : ''}"><div class="vitesse-titre">${apres > avant ? '🚀 Palier suivant !' : `Ta vitesse : ${pn.emoji} ${pn.nom}`}</div>
    <div class="vitesse-texte">${msg}</div>${nouveauRecord ? `<div class="vitesse-texte">🏅 Nouveau record sur cette astuce : ${formatNum(Math.round(tempsMoyen * 10) / 10)} s en moyenne.</div>` : ''}</div>`;
}

function renderQuizResults() {
  const qz = state.quiz; const total = qz.total || qz.questions.length;
  const pct = qz.total ? Math.round((qz.score / total) * 100) : 0;
  const avgTime = qz.total ? Math.round((qz.times.reduce((a, b) => a + b, 0) / total) * 10) / 10 : 0;
  const emoji = pct === 100 ? '🏆' : pct >= 80 ? '🌟' : pct >= 50 ? '👍' : '💪';
  const title = pct === 100 ? 'Parfait !' : pct >= 80 ? 'Excellent !' : pct >= 50 ? 'Bien joué !' : "Continue à t'entraîner";
  let verdictClass = 'verdict-good', verdictText = "Compétence maîtrisée ! Essaie-en une autre ou monte de niveau.";
  if (pct < 50) { verdictClass = 'verdict-low'; verdictText = "Cette notion mérite d'être revue calmement. Relis la leçon puis réessaie."; }
  else if (pct < 80) { verdictClass = 'verdict-mid'; verdictText = 'Bonne base ! Encore un peu de pratique pour bien maîtriser.'; }
  if (qz.etapeValidee === false) { verdictClass = 'verdict-low'; verdictText = `Le calcul mental du jour est obligatoire : il faut au moins ${SEUIL_MENTAL_JOUR} % pour le valider et débloquer la suite de la séance. Relis les corrections, puis rejoue !`; }
  else if (qz.etapeValidee && qz.kind === 'mix' && qz.etapeSeance === 0) verdictText = 'Calcul mental du jour validé ! La suite de ta séance est débloquée.';
  const cats = Object.keys(qz.catStats);
  const breakdownHtml = cats.length > 1 ? `<div class="breakdown-list">${cats.map(c => `<div class="breakdown-row"><span>${c}</span><span>${qz.catStats[c].correct}/${qz.catStats[c].total}</span></div>`).join('')}</div>` : '';
  return `<div class="screen screen-resultat">
    <div class="results-emoji">${emoji}</div><div class="results-title">${title}</div>
    <div class="results-card"><div class="results-score">${qz.score} / ${total}</div><div class="results-meta">${pct}% de réussite · ${avgTime}s en moyenne par question</div></div>
    ${renderBilanVitesse(qz)}
    ${breakdownHtml}
    ${renderGain(qz.gain, pct)}
    <div class="verdict-box ${verdictClass}">${verdictText}</div>
    ${renderARevoir(qz.erreurs)}
    <div class="btn-stack"><button class="btn btn-primary" data-action="retry-quiz">🔄 Rejouer</button><button class="btn btn-secondary" data-action="go-home">← Retour à l'accueil</button></div>
  </div>`;
}

/* ================= Actions ================= */
function onAction(e) {
  const a = e.currentTarget.dataset.action;
  if (a === 'set-level') setLevel(e.currentTarget.dataset.level);
  else if (a === 'go-home') { clearTimer(); stopperVoix(); state.screen = 'home'; state.quiz = null; state.etapeMentale = undefined; render(); }
  else if (a === 'open-domain') {
    const id = e.currentTarget.dataset.id;
    if (id === 'dictee') { state.screen = 'dicteeList'; render(); return; }
    state.currentDomain = id; state.screen = 'skillList'; render();
  }
  else if (a === 'etape-seance') ouvrirEtape(Number(e.currentTarget.dataset.i));
  else if (a === 'open-dictee') ouvrirDictee(e.currentTarget.dataset.id);
  else if (a === 'back-to-dictees') { stopperVoix(); state.screen = 'dicteeList'; render(); }
  else if (a === 'dire-phrase') direTexte(phrasesDe(getDictee(state.dictee.id).texte)[state.dictee.phrase], state.dictee.vitesse);
  else if (a === 'dire-tout') direTexte(getDictee(state.dictee.id).texte, state.dictee.vitesse);
  else if (a === 'phrase-suivante') { stopperVoix(); state.dictee.phrase++; render(); }
  else if (a === 'phrase-precedente') { stopperVoix(); state.dictee.phrase--; render(); }
  else if (a === 'vitesse-lente') { state.dictee.vitesse = 0.75; render(); }
  else if (a === 'vitesse-normale') { state.dictee.vitesse = 0.95; render(); }
  else if (a === 'afficher-texte') { state.dictee.texteVisible = true; render(); }
  else if (a === 'cacher-texte') { state.dictee.texteVisible = false; render(); }
  else if (a === 'corriger-dictee') corrigerEtAfficher();
  else if (a === 'refaire-dictee') ouvrirDictee(state.dictee.id);
  else if (a === 'back-to-list') { state.screen = 'skillList'; render(); }
  else if (a === 'open-mental') { state.etapeMentale = undefined; state.mentalTrickId = e.currentTarget.dataset.id; state.screen = 'mentalLesson'; render(); }
  else if (a === 'open-skill') { state.currentSkill = e.currentTarget.dataset.id; state.screen = 'skillLesson'; render(); }
  else if (a === 'regen') { render(); }
  else if (a === 'start-mental-quiz') { const id = state.mentalTrickId, lvl = state.level; state.etapeMentale = undefined; startQuiz('mental', () => buildMentalQuiz(id, 8), 'mental-' + id + '-' + lvl, { trickId: id, niveau: lvl }); }
  else if (a === 'start-mental-jour') {
    const i = state.etapeMentale, e = construireSeance(jourCle())[i];
    startQuiz('mix', () => buildQuizDuJour(e.trick, e.niveau), 'jour-mental-' + e.niveau);
    state.quiz.etapeSeance = i;
  }
  else if (a === 'start-sprint') { const lvl = state.level; startQuiz('sprint', () => buildSprint(lvl), 'sprint-' + lvl, { sprint: true }); }
  else if (a === 'start-revision') { const lvl = state.level; startQuiz('mix', () => buildRevision(lvl), 'revision-' + lvl); }
  else if (a === 'touche') toucher(e.currentTarget.dataset.k);
  else if (a === 'valider-saisie') validerSaisie();
  else if (a === 'start-skill-quiz') { const dId = state.currentDomain, sId = state.currentSkill; startQuiz('skill', () => buildSkillQuiz(dId, sId, 8), 'skill-' + dId + '-' + sId + '-' + state.level); }
  else if (a === 'answer-quiz') { state.quiz.lastChosen = e.currentTarget.dataset.value; answerQuiz(e.currentTarget.dataset.value); }
  else if (a === 'retry-quiz') { const etape = state.quiz.etapeSeance; startQuiz(state.quiz.kind, state.quiz.rebuild, state.quiz.bestKey, state.quiz.extra); state.quiz.etapeSeance = etape; }
  else if (a === 'continuer-quiz') questionSuivante();
  else if (a === 'toggle-pause') basculerPause();
}

render();

/* ================= PWA install ================= */
let deferredPrompt;

/* Déjà installée : l'app se lance alors dans sa propre fenêtre, sans barre
   d'adresse. Inutile de proposer de l'installer une seconde fois. */
function isInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

/* La bande revient au bout d'une semaine si elle a été fermée sans installer. */
const INSTALL_SNOOZE = 7 * 24 * 3600 * 1000;
function installSnoozed() { const s = loadStore(); return s.installHiddenAt && Date.now() - s.installHiddenAt < INSTALL_SNOOZE; }
function snoozeInstall() { const s = loadStore(); s.installHiddenAt = Date.now(); saveStore(s); }

/* Chrome sur Android laisse déclencher l'installation depuis la page. */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; showInstallBanner(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; hideInstallBanner(); });

/* Ailleurs (iPhone, Firefox, Chrome qui ne propose rien) l'événement ci-dessus
   n'arrive jamais : on affiche alors la marche à suivre du navigateur. */
window.addEventListener('load', () => { setTimeout(() => { if (!deferredPrompt) showInstallBanner(); }, 3000); });

function showInstallBanner() {
  if (document.getElementById('install-banner') || isInstalled() || installSnoozed()) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const banner = document.createElement('div'); banner.id = 'install-banner'; banner.className = 'install-banner';
  const help = isIOS ? "Appuie sur Partager puis « Sur l'écran d'accueil »" : "Ouvre le menu ⋮ puis « Installer l'application »";
  banner.innerHTML = `<div class="install-text">📲 Installe l'appli sur ton téléphone !${deferredPrompt ? '' : `<span class="install-help">${help}</span>`}</div>${deferredPrompt ? '<button class="install-btn">Installer</button>' : ''}<button class="dismiss-btn">✕</button>`;
  document.body.appendChild(banner);
  /* la bande est fixée en bas de l'écran : on réserve sa hauteur dans #app,
     sinon elle recouvrirait la dernière carte et le bouton « Pratiquer ». */
  document.documentElement.style.setProperty('--install-offset', banner.offsetHeight + 'px');
  const installBtn = banner.querySelector('.install-btn');
  if (installBtn) installBtn.addEventListener('click', async () => { hideInstallBanner(); if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; } });
  banner.querySelector('.dismiss-btn').addEventListener('click', () => { hideInstallBanner(); snoozeInstall(); });
}

function hideInstallBanner() {
  const banner = document.getElementById('install-banner');
  if (banner) banner.remove();
  document.documentElement.style.removeProperty('--install-offset');
}
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
